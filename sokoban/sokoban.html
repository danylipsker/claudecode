<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="pwa.json">
<title>Sokoban</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #191d33;
    --panel-2: #222741;
    --line: #2e3455;
    --text: #e8eaf6;
    --muted: #969db8;
    --accent: #6c7bff;
    --gold: #ffd166;
    --teal: #38d9d3;
    --green: #4ecb8d;
    --warn: #ffb057;

    --floor-a: #1e2342;
    --floor-b: #1a1f3b;
    --wall-top: #4b5288;
    --wall-bot: #2c3160;
    --crate-a: #d69551;
    --crate-b: #a2612b;
    --crate-line: #7a4519;
    --done-a: #6fe0a4;
    --done-b: #2f9e69;
    --done-line: #1e7a4f;

    --cell: 44px;
    --speed: 110ms;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  input { -webkit-user-select: text; user-select: text; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    background: radial-gradient(1200px 700px at 50% -10%, #1d2340 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
  }

  .app { width: 100%; max-width: 640px; }

  header { text-align: center; margin-bottom: 14px; }
  h1 {
    margin: 0 0 2px;
    font-size: 1.9rem;
    letter-spacing: .5px;
  }
  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: .88rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- status bar ---------- */

  #hud {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 7px 4px;
    text-align: center;
    min-width: 0;
  }
  .stat .label {
    font-size: .62rem;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
  }
  .stat .value {
    font-size: 1.1rem;
    font-weight: 700;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat.level .value { color: var(--accent); font-size: .95rem; }
  .stat.par .value { color: var(--gold); }
  .stat.best .value { color: var(--teal); font-size: .95rem; }

  /* ---------- board ---------- */

  .stage {
    position: relative;
    display: flex;
    justify-content: center;
    margin-bottom: 12px;
  }

  #board {
    position: relative;
    border-radius: 16px;
    padding: 10px;
    background: linear-gradient(180deg, #171b30, #12162a);
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .04);
  }

  #grid {
    position: relative;
    display: grid;
    grid-auto-rows: var(--cell);
  }

  .tile { width: var(--cell); height: var(--cell); position: relative; }

  .tile.floor {
    background: var(--floor-a);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .022);
  }
  .tile.floor.alt { background: var(--floor-b); }

  .tile.wall {
    background: linear-gradient(180deg, var(--wall-top), var(--wall-bot));
    border-radius: 5px;
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, .13),
      inset 0 -2px 0 rgba(0, 0, 0, .3),
      0 1px 2px rgba(0, 0, 0, .35);
  }
  .tile.wall::after {
    content: "";
    position: absolute;
    inset: 22% 16%;
    border-radius: 3px;
    background: rgba(255, 255, 255, .045);
  }

  .tile.goal::after {
    content: "";
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #fff2c9, var(--gold) 55%, rgba(255, 209, 102, 0) 72%);
    box-shadow: 0 0 10px rgba(255, 209, 102, .45);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .75; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.14); }
  }

  /* ---------- entities ---------- */

  .ent {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--cell);
    height: var(--cell);
    transform: translate3d(calc(var(--x) * var(--cell)), calc(var(--y) * var(--cell)), 0);
    transition: transform var(--speed) ease-out;
    will-change: transform;
  }

  .crate {
    position: absolute;
    inset: 8%;
    border-radius: 6px;
    background: linear-gradient(155deg, var(--crate-a), var(--crate-b));
    box-shadow:
      inset 0 0 0 2px var(--crate-line),
      inset 0 3px 0 rgba(255, 255, 255, .16),
      0 3px 6px rgba(0, 0, 0, .4);
    transition: background .18s, box-shadow .18s;
    overflow: hidden;
  }
  .crate::before,
  .crate::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 132%;
    height: 13%;
    margin: -6.5% 0 0 -66%;
    background: var(--crate-line);
    opacity: .55;
  }
  .crate::before { transform: rotate(45deg); }
  .crate::after  { transform: rotate(-45deg); }

  .box.on .crate {
    background: linear-gradient(155deg, var(--done-a), var(--done-b));
    box-shadow:
      inset 0 0 0 2px var(--done-line),
      inset 0 3px 0 rgba(255, 255, 255, .22),
      0 0 14px rgba(78, 203, 141, .5),
      0 3px 6px rgba(0, 0, 0, .4);
  }
  .box.on .crate::before,
  .box.on .crate::after { background: var(--done-line); }

  @keyframes settle {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  .box.pop .crate { animation: settle .26s ease-out; }

  /* player */

  .player .body {
    position: absolute;
    inset: 12%;
    border-radius: 42% 42% 38% 38% / 46% 46% 34% 34%;
    background: radial-gradient(circle at 34% 26%, #8ff3ef, var(--teal) 52%, #21a8a3 100%);
    box-shadow:
      inset 0 -3px 0 rgba(0, 0, 0, .18),
      0 3px 7px rgba(0, 0, 0, .45),
      0 0 14px rgba(56, 217, 211, .28);
  }
  .player .eyes {
    position: absolute;
    inset: 30% 24% auto 24%;
    display: flex;
    justify-content: space-between;
  }
  .player .eye {
    position: relative;
    width: 30%;
    aspect-ratio: 1;
    background: #f4f7ff;
    border-radius: 50%;
    box-shadow: inset 0 1px 1px rgba(0, 0, 0, .2);
  }
  .player .eye i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 52%;
    height: 52%;
    margin: -26% 0 0 -26%;
    border-radius: 50%;
    background: #1b2140;
    transition: transform .1s ease-out;
  }
  .player.face-up    .eye i { transform: translateY(-32%); }
  .player.face-down  .eye i { transform: translateY(30%); }
  .player.face-left  .eye i { transform: translateX(-34%); }
  .player.face-right .eye i { transform: translateX(34%); }

  .player.cheer .body { animation: cheer .5s ease-in-out 2; }
  @keyframes cheer {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    35%      { transform: translateY(-16%) scale(.94, 1.06); }
    70%      { transform: translateY(0) scale(1.06, .94); }
  }

  .nudge { animation: nudge .16s ease-out; }
  @keyframes nudge {
    50% { filter: brightness(1.35); }
  }

  /* ---------- win overlay ---------- */

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 16px;
    background: rgba(12, 15, 28, .82);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    text-align: center;
    padding: 16px;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #overlay h2 {
    margin: 0;
    font-size: 1.5rem;
    color: var(--green);
  }
  #overlay .detail { color: var(--muted); font-size: .9rem; }
  #overlay .medal { color: var(--gold); font-weight: 700; font-size: .92rem; min-height: 1.2em; }
  #overlay .btn { margin-top: 8px; min-width: 170px; flex: 0 0 auto; }

  /* ---------- controls ---------- */

  .actions {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .btn {
    flex: 1 1 0;
    min-width: 88px;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); background: #2a3050; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #5a6aff; }
  .btn .key {
    display: inline-block;
    margin-left: 5px;
    font-size: .7rem;
    color: var(--muted);
    font-weight: 500;
  }
  .btn.primary .key { color: rgba(255, 255, 255, .7); }
  .btn.icon { flex: 0 0 46px; min-width: 46px; font-size: 1rem; }

  #hint {
    text-align: center;
    font-size: .8rem;
    color: var(--muted);
    min-height: 1.4em;
  }
  #hint.stuck { color: var(--warn); font-weight: 600; }

  /* d-pad, for touch devices */

  #dpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
    justify-content: center;
    margin: 4px 0 10px;
  }
  #dpad button {
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
  }
  #dpad button:active { background: var(--accent); }
  #dpad .up { grid-column: 2; grid-row: 1; }
  #dpad .left { grid-column: 1; grid-row: 2; }
  #dpad .down { grid-column: 2; grid-row: 2; }
  #dpad .right { grid-column: 3; grid-row: 2; }
  @media (hover: none) and (pointer: coarse) {
    #dpad { display: grid; }
    #hint .keys { display: none; }
  }

  /* ---------- level library ---------- */

  #browser {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(8, 10, 20, .72);
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  #browser.show { display: flex; }
  .sheet {
    width: 100%;
    max-width: 720px;
    height: min(88vh, 780px);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .sheet > * { flex: 0 0 auto; }
  .sheet h3 {
    margin: 0 0 12px;
    font-size: 1.05rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sheet h3 span + span { font-size: .78rem; color: var(--muted); font-weight: 500; }
  .sheet .actions { margin-bottom: 0; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }
  .chip {
    max-width: 100%;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    font-size: .8rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip small { margin-left: 5px; font-size: .7rem; font-weight: 500; color: var(--muted); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.active small { color: rgba(255, 255, 255, .75); }

  .about {
    margin: 0 0 10px;
    font-size: .78rem;
    line-height: 1.4;
    color: var(--muted);
  }

  .setbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .setbar input {
    flex: 1 1 auto;
    min-width: 0;
    height: 28px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .setbar .btn, .tools .btn { flex: 0 0 auto; min-width: 0; padding: 8px 14px; }

  .tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tools .where { flex: 1 1 190px; font-size: .8rem; color: var(--muted); }
  .tools input {
    width: 128px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #12162a;
    color: var(--text);
    font: inherit;
    font-size: .9rem;
  }
  .tools input:focus { outline: none; border-color: var(--accent); }

  .sheet .scroll {
    flex: 1 1 auto;
    min-height: 130px;
    overflow-y: auto;
    margin: 0 -6px 12px;
    padding: 3px 6px;
  }
  .thumbs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 8px;
  }
  .empty {
    padding: 30px 12px;
    text-align: center;
    font-size: .85rem;
    line-height: 1.5;
    color: var(--muted);
  }
  .empty .btn { display: block; margin: 12px auto 0; flex: none; }
  .thumb {
    padding: 5px 5px 3px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    font: inherit;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .thumb:hover { border-color: var(--accent); }
  .thumb canvas {
    width: 100%;
    display: block;
    border-radius: 5px;
    background: var(--floor-a);
  }
  .thumb small { display: block; font-size: .62rem; font-weight: 500; margin-top: 3px; }
  .thumb.done { border-color: rgba(78, 203, 141, .55); background: rgba(78, 203, 141, .1); }
  .thumb.done small { color: var(--green); }
  .thumb.current { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (prefers-reduced-motion: reduce) {
    .ent { transition: none; }
    .tile.goal::after,
    .box.pop .crate,
    .player.cheer .body { animation: none; }
  }

  @media (max-width: 460px) {
    #browser { padding: 10px; }
    .sheet { height: 94vh; padding: 12px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; }
    .tools .where { flex-basis: 100%; }
    .tools input { flex: 1 1 0; width: auto; min-width: 0; }
    .sheet .actions { flex-wrap: nowrap; gap: 6px; }
    .sheet .actions .btn { min-width: 0; padding: 10px 4px; font-size: .82rem; white-space: nowrap; }
    .thumbs { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
    h1 { font-size: 1.5rem; }
    #hud { grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .stat .value { font-size: .95rem; }
    .stat.level .value, .stat.best .value { font-size: .78rem; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sokoban</h1>
    <p class="subtitle" id="subtitle">Push every crate onto a glowing pad</p>
  </header>

  <div id="hud">
    <div class="stat level"><div class="label" id="statLevelLabel">Level</div><div class="value" id="statLevel">1</div></div>
    <div class="stat"><div class="label">Moves</div><div class="value" id="statMoves">0</div></div>
    <div class="stat"><div class="label">Pushes</div><div class="value" id="statPushes">0</div></div>
    <div class="stat par"><div class="label">Par</div><div class="value" id="statPar">1</div></div>
    <div class="stat best"><div class="label">Best</div><div class="value" id="statBest">—</div></div>
  </div>

  <div class="stage">
    <div id="board">
      <div id="grid"></div>
      <div id="overlay">
        <h2 id="winTitle">Level complete!</h2>
        <div class="detail" id="winDetail"></div>
        <div class="medal" id="winMedal"></div>
        <button class="btn primary" id="nextLevel">Next Level</button>
      </div>
    </div>
  </div>

  <div id="dpad">
    <button class="up" data-dir="up" aria-label="Up">▲</button>
    <button class="left" data-dir="left" aria-label="Left">◀</button>
    <button class="down" data-dir="down" aria-label="Down">▼</button>
    <button class="right" data-dir="right" aria-label="Right">▶</button>
  </div>

  <div class="actions">
    <button class="btn" id="undo">Undo<span class="key">U</span></button>
    <button class="btn" id="restart">Restart<span class="key">R</span></button>
    <button class="btn" id="prev">Prev</button>
    <button class="btn" id="next">Next<span class="key">N</span></button>
    <button class="btn" id="levels" title="Browse every level">Levels<span class="key">L</span></button>
    <button class="btn" id="open" title="Load levels from a .txt file">Open<span class="key">O</span></button>
    <button class="btn icon" id="sound" title="Toggle sound">🔊</button>
  </div>
  <input type="file" id="file" accept=".txt,text/plain" hidden>

  <div id="hint"><span class="keys">Arrow keys or WASD to move · swipe on the board on touch</span></div>
</div>

<div id="browser">
  <div class="sheet">
    <h3><span>Level library</span> <span id="packInfo"></span></h3>
    <div class="chips" id="chips"></div>
    <p class="about" id="about"></p>
    <div class="setbar" id="setBar">
      <button class="btn" id="setPrev" aria-label="Previous set">◀</button>
      <input type="range" id="setSlider" min="1" max="1" step="1" aria-label="Set of levels">
      <button class="btn" id="setNext" aria-label="Next set">▶</button>
    </div>
    <div class="tools">
      <span class="where" id="where"></span>
      <input type="number" id="jumpTo" min="1" step="1" inputmode="numeric" aria-label="Level number">
      <button class="btn" id="jumpGo">Go</button>
      <button class="btn" id="random" title="Jump to a level you have not solved yet">Random</button>
    </div>
    <div class="scroll" id="scroll">
      <div class="thumbs" id="thumbGrid"></div>
      <div class="empty" id="empty" hidden></div>
    </div>
    <div class="actions">
      <button class="btn" id="openMore">Open File…</button>
      <button class="btn" id="wipe">Reset Progress</button>
      <button class="btn primary" id="closeBrowser">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ *

  const LEVELS = [

    { name: "Pinwheel", par: 8, rows: [

      "#  $ $  #",
      "# .   . #",

    ]},

      "#  ####  #",
      "#        #",
      "#  $$$$  #",
      "#   @    #",
      "##########"
    ]}

  const DIRS = {
    up:    { dx:  0, dy: -1 },
    down:  { dx:  0, dy:  1 },
    left:  { dx: -1, dy:  0 },
    right: { dx:  1, dy:  0 }
  };

  const STORE_KEY = "sokoban.progress.v1";

  /* ---------- persistence ---------- */

  function loadProgress() {
    try {
      const data = JSON.parse(localStorage.getItem(STORE_KEY));
      return data && typeof data === "object" ? data : {};
    } catch (e) {
      return {};
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(progress));
    } catch (e) {
      /* private mode: play on without saving */
    }
  }

  let progress = loadProgress();
  let soundOn = progress.sound !== false;

  // Where each collection was left, by collection id.
  if (!progress.at || typeof progress.at !== "object") progress.at = {};

  // niveles.txt used to be opened as a file; it is the built-in Microban set now.
  for (const key of Object.keys(progress)) {
    if (!key.startsWith("pk:niveles.txt:")) continue;
    const moved = "pk:microban:" + key.slice(15);
    if (!progress[moved]) progress[moved] = progress[key];
  }

  /* ---------- level parsing ---------- */

  function parseLevel(def) {
    const w = Math.max.apply(null, def.rows.map(r => r.length));
    const h = def.rows.length;
    const walls = [];
    const goals = [];
    const boxes = [];
    let player = null;

    for (let y = 0; y < h; y++) {
      const row = def.rows[y].padEnd(w, " ");
      walls.push([]);
      goals.push([]);
      for (let x = 0; x < w; x++) {
        const c = row[x];
        walls[y][x] = c === "#";
        goals[y][x] = c === "." || c === "*" || c === "+";
        if (c === "$" || c === "*") boxes.push({ x, y });
        if (c === "@" || c === "+") player = { x, y };
      }
    }
    return { name: def.name, par: def.par, w, h, walls, goals, boxes, player };
  }

  /* ---------- level files ---------- *
   * Accepts boxoban files ("; 0" headers, one 10x10 grid each) and generic
   * Sokoban text files ("Level 1" headers or blank-line-separated grids).
   * A line counts as board data when it holds only level glyphs and at
   * least one wall; anything else ends the current grid. A quoted line
   * above a grid names it. Grids without a player, without crates, or with
   * more crates than goals are unwinnable in this engine and are dropped.
   */
  function parseLevelPack(text) {
    const defs = [];
    let rows = [], name;
    const isBoard = s => /^[ #.$*@+]+$/.test(s) && s.includes("#");

    const flush = () => {
      if (!rows.length) return;
      if (rows.length >= 3) {
        const flat = rows.join("");
        const crates = (flat.match(/[$*]/g) || []).length;
        const goals = (flat.match(/[.*+]/g) || []).length;
        if (/[@+]/.test(flat) && crates > 0 && crates <= goals) defs.push({ name, rows });
      }
      rows = [];
      name = undefined;
    };

    for (const raw of text.split(/\r?\n/)) {
      const line = raw.replace(/\s+$/, "");
      if (isBoard(line)) { rows.push(line); continue; }
      flush();
      const m = line.match(/^\s*(['"])(.+)\1$/);
      if (m) name = m[2];
    }
    flush();
    return defs;
  }

  /* ---------- packed boxoban sets ---------- *
   * Every boxoban level is a walled 10x10 board, so only the 64 inner cells
   * carry information, each one of five glyphs. Three cells to a byte in
   * base 5 makes 22 bytes a level: a fifth of the text. The built-in hard
   * set and the sets kept on the device for offline play are stored this way.
   */
  const GLYPHS = " #$.@";
  const PACKED = 22;
  const EDGE = "##########";

  function packLevels(defs) {
    const out = new Uint8Array(defs.length * PACKED);
    for (let n = 0; n < defs.length; n++) {
      const rows = defs[n].rows;
      if (rows.length !== 10 || rows[0] !== EDGE || rows[9] !== EDGE) return null;
      let cells = "";
      for (let y = 1; y < 9; y++) {
        const r = rows[y];
        if (r.length !== 10 || r[0] !== "#" || r[9] !== "#") return null;
        cells += r.slice(1, 9);
      }
      for (let i = 0; i < 64; i += 3) {
        let b = 0;
        for (let j = Math.min(2, 63 - i); j >= 0; j--) {
          const g = GLYPHS.indexOf(cells[i + j]);
          if (g < 0) return null;
          b = b * 5 + g;
        }
        out[n * PACKED + i / 3] = b;
      }
    }
    return out;
  }

  function unpackLevels(bytes) {
    const defs = [];
    for (let at = 0; at + PACKED <= bytes.length; at += PACKED) {
      let cells = "";
      for (let i = 0; i < PACKED; i++) {
        let b = bytes[at + i];
        for (let j = 0; j < 3; j++) {
          cells += GLYPHS[b % 5];
          b = Math.floor(b / 5);
        }
      }
      const rows = [EDGE];
      for (let y = 0; y < 8; y++) rows.push("#" + cells.substr(y * 8, 8) + "#");
      rows.push(EDGE);
      defs.push({ rows });
    }
    return defs;
  }

  /* ---------- sets kept on the device ---------- *
   * A downloaded set goes into IndexedDB, so it opens at once next time and
   * still opens with no connection. Every failure here is survivable: the
   * set is simply fetched again.
   */
  const kept = (() => {
    let db = null;
    const open = () => db || (db = new Promise((resolve, reject) => {
      const rq = indexedDB.open("sokoban-levels", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("sets");
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = rq.onblocked = () => reject(rq.error);
    }));
    const run = (mode, act) => Promise.resolve().then(open).then(base => new Promise((resolve, reject) => {
      const rq = act(base.transaction("sets", mode).objectStore("sets"));
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    }));
    return {
      get: key => run("readonly", s => s.get(key)).catch(() => undefined),
      put: (key, value) => run("readwrite", s => s.put(value, key)).catch(() => {})
    };
  })();

  /* ---------- level library ---------- *
   * A collection hands out its levels in sets of SET, the size of a boxoban
   * file; `load(k)` resolves to the level definitions of set k. The small
   * collections are a single set. Medium and Unfiltered are far too large
   * to ship (1.5 million levels), so their sets are fetched when first
   * opened, from the public boxoban repository, and kept on the device.
   */
  const SET = 1000;

  const SOURCES = [
    "https://raw.githubusercontent.com/google-deepmind/boxoban-levels/master/",
    "https://cdn.jsdelivr.net/gh/google-deepmind/boxoban-levels@master/"
  ];
  // A development server has the dataset beside the game.
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) SOURCES.unshift("boxoban-levels-master/");

  function fetchLevels(url) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    return fetch(url, { signal: ctl.signal })
      .then(res => {
        if (!res.ok) throw new Error(res.status + " " + url);
        return res.text();
      })
      .then(text => {
        const defs = parseLevelPack(text);
        if (!defs.length) throw new Error("no levels in " + url);
        return defs;
      })
      .finally(() => clearTimeout(timer));
  }

  function download(path) {
    let attempt = Promise.reject();
    for (const base of SOURCES) attempt = attempt.catch(() => fetchLevels(base + path + ".txt"));
    return attempt;
  }

  // folders: [path in the dataset, number of files], in playing order.
  function remote(folders) {
    const recent = new Map();   // set number -> defs, a few of the latest
    const pending = new Map();

    const pathOf = k => {
      for (const [dir, files] of folders) {
        if (k < files) return dir + "/" + String(k).padStart(3, "0");
        k -= files;
      }
      return null;
    };

    return k => {
      if (recent.has(k)) return Promise.resolve(recent.get(k));
      if (pending.has(k)) return pending.get(k);
      const path = pathOf(k);
      if (!path) return Promise.reject(new Error("no set " + k));

      const job = kept.get(path)
        .then(saved => {
          if (saved instanceof Uint8Array) return unpackLevels(saved);
          if (Array.isArray(saved)) return saved.map(rows => ({ rows }));
          return download(path).then(defs => {
            kept.put(path, packLevels(defs) || defs.map(d => d.rows));
            return defs;
          });
        })
        .then(defs => {
          recent.set(k, defs);
          if (recent.size > 6) recent.delete(recent.keys().next().value);
          return defs;
        })
        .finally(() => pending.delete(k));

      pending.set(k, job);
      return job;
    };
  }

  // A collection that is whole in memory, cut into sets.
  const local = defs => k => Promise.resolve(defs.slice(k * SET, (k + 1) * SET));

  const embedded = id => document.getElementById(id).textContent;

  function fromBase64(text) {
    const bin = atob(text.replace(/\s+/g, ""));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  const microban = parseLevelPack(embedded("set-microban"));
  const hardBytes = fromBase64(embedded("set-hard"));
  let hard = null;

  const BUILT_IN = " Built in, so it plays with no connection.";
  const ON_DEMAND = " Each set of 1,000 downloads the first time it is opened and then stays on this device.";

  const LIBRARY = [
    {
      id: "classic", name: "Classic", short: "Classic", count: LEVELS.length,
      about: "Sixteen warm-up levels, each with a verified par." + BUILT_IN,
      load: local(LEVELS)
    },
    {
      id: "microban", name: "Microban", short: "Microban", count: microban.length,
      about: "Microban by David W. Skinner: small, friendly puzzles that each teach one idea." + BUILT_IN,
      load: local(microban)
    },
    {
      id: "hard", name: "Boxoban Hard", short: "Hard", count: hardBytes.length / PACKED,
      about: "Boxoban by DeepMind: four crates on a 10 × 10 board. The hard set." + BUILT_IN,
      load: k => local(hard || (hard = unpackLevels(hardBytes)))(k)
    },
    {
      id: "medium", name: "Boxoban Medium", short: "Medium", count: 500 * SET,
      about: "Boxoban by DeepMind: four crates on a 10 × 10 board. The medium set." + ON_DEMAND,
      load: remote([["medium/train", 450], ["medium/valid", 50]])
    },
    {
      id: "unfiltered", name: "Boxoban Unfiltered", short: "Unfiltered", count: 1001 * SET,
      about: "Boxoban by DeepMind: four crates on a 10 × 10 board. The unfiltered set, mostly gentle." + ON_DEMAND,
      load: remote([["unfiltered/train", 900], ["unfiltered/valid", 100], ["unfiltered/test", 1]])
    }
  ].filter(c => c.count > 0);

  let opened = null; // the collection read from a file with Open, if any

  const collections = () => opened ? LIBRARY.concat(opened) : LIBRARY;
  const setsIn = col => Math.ceil(col.count / SET);
  const fmt = n => n.toLocaleString("en-US");

  // Cells the player can ever stand on — used to hide scenery outside the level.
  function reachable(level) {
    const seen = Array.from({ length: level.h }, () => new Array(level.w).fill(false));
    const stack = [level.player];
    seen[level.player.y][level.player.x] = true;
    while (stack.length) {
      const { x, y } = stack.pop();
      for (const d of Object.values(DIRS)) {
        const nx = x + d.dx, ny = y + d.dy;
        if (nx < 0 || ny < 0 || nx >= level.w || ny >= level.h) continue;
        if (seen[ny][nx] || level.walls[ny][nx]) continue;
        seen[ny][nx] = true;
        stack.push({ x: nx, y: ny });
      }
    }
    return seen;
  }

  /* ---------- state ---------- */

  const el = {
    grid: document.getElementById("grid"),
    board: document.getElementById("board"),
    overlay: document.getElementById("overlay"),
    winTitle: document.getElementById("winTitle"),
    winDetail: document.getElementById("winDetail"),
    winMedal: document.getElementById("winMedal"),
    hint: document.getElementById("hint"),
    subtitle: document.getElementById("subtitle"),
    statLevelLabel: document.getElementById("statLevelLabel"),
    statLevel: document.getElementById("statLevel"),
    statMoves: document.getElementById("statMoves"),
    statPushes: document.getElementById("statPushes"),
    statPar: document.getElementById("statPar"),
    statBest: document.getElementById("statBest"),
    browser: document.getElementById("browser"),
    chips: document.getElementById("chips"),
    about: document.getElementById("about"),
    setBar: document.getElementById("setBar"),
    setSlider: document.getElementById("setSlider"),
    where: document.getElementById("where"),
    jumpTo: document.getElementById("jumpTo"),
    scroll: document.getElementById("scroll"),
    thumbGrid: document.getElementById("thumbGrid"),
    empty: document.getElementById("empty"),
    packInfo: document.getElementById("packInfo"),
    wipe: document.getElementById("wipe"),
    file: document.getElementById("file"),
    undo: document.getElementById("undo"),
    next: document.getElementById("next"),
    prev: document.getElementById("prev"),
    sound: document.getElementById("sound")
  };

  const state = {
    col: LIBRARY[0],
    index: 0,
    level: null,
    boxes: [],
    player: null,
    facing: "down",
    moves: 0,
    pushes: 0,
    history: [],
    won: false,
    boxEls: [],
    playerEl: null
  };

  // Every collection keeps its own progress namespace, so bests never mix.
  const keyStem = col => col.id === "classic" ? "lv" : "pk:" + col.id + ":";
  const progKey = (col, i) => keyStem(col) + i;
  const isBest = (key, stem) => key.startsWith(stem) && /^\d+$/.test(key.slice(stem.length));

  function countSolved(col) {
    const stem = keyStem(col);
    let n = 0;
    for (const key in progress) if (isBest(key, stem) && +key.slice(stem.length) < col.count) n++;
    return n;
  }

  // A short message that stands in the hint line until the next move.
  let notice = null;
  function say(text, warn) {
    notice = { text, warn };
    if (state.level) updateHud();
    else {
      el.hint.className = warn ? "stuck" : "";
      el.hint.textContent = text;
    }
  }

  const at =(list, x, y) => list.findIndex(b => b.x === x && b.y === y);
  const isWall = (x, y) => state.level.walls[y][x];
  const isGoal = (x, y) => state.level.goals[y][x];
  const plural = (n, word, suffix) => n + " " + word + (n === 1 ? "" : (suffix || "s"));

  /* ---------- rendering ---------- */

  function buildBoard() {
    const level = state.level;
    const open = reachable(level);
    const grid = el.grid;

    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${level.w}, var(--cell))`;

    // A wall is drawn only if it borders somewhere the player can go, so the
    // level keeps a clean silhouette instead of a padded rectangle.
    const bordersOpen = (x, y) => {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= level.w || ny >= level.h) continue;
          if (open[ny][nx]) return true;
        }
      }
      return false;
    };

    for (let y = 0; y < level.h; y++) {
      for (let x = 0; x < level.w; x++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        if (level.walls[y][x]) {
          if (bordersOpen(x, y)) tile.classList.add("wall");
        } else if (open[y][x]) {
          tile.classList.add("floor");
          if ((x + y) % 2) tile.classList.add("alt");
          if (level.goals[y][x]) tile.classList.add("goal");
        }
        grid.appendChild(tile);
      }
    }

    // Entities live above the tile grid and slide between cells.
    state.boxEls = state.boxes.map(() => {
      const box = document.createElement("div");
      box.className = "ent box";
      box.innerHTML = '<div class="crate"></div>';
      grid.appendChild(box);
      return box;
    });

    const p = document.createElement("div");
    p.className = "ent player face-down";
    p.innerHTML = '<div class="body"><div class="eyes"><div class="eye"><i></i></div><div class="eye"><i></i></div></div></div>';
    grid.appendChild(p);
    state.playerEl = p;

    fitBoard();
    drawEntities(true);
  }

  function place(node, x, y) {
    node.style.setProperty("--x", x);
    node.style.setProperty("--y", y);
  }

  function drawEntities(instant) {
    if (instant) el.grid.style.setProperty("--speed", "0ms");

    state.boxes.forEach((b, i) => {
      const node = state.boxEls[i];
      place(node, b.x, b.y);
      const on = isGoal(b.x, b.y);
      if (on && !node.classList.contains("on")) pop(node);
      node.classList.toggle("on", on);
    });

    place(state.playerEl, state.player.x, state.player.y);
    state.playerEl.className = "ent player face-" + state.facing;

    if (instant) requestAnimationFrame(() => el.grid.style.removeProperty("--speed"));
  }

  function pop(node) {
    node.classList.remove("pop");
    void node.offsetWidth;
    node.classList.add("pop");
  }

  // Scale cells so the whole level fits the viewport without scrolling.
  function fitBoard() {
    if (!state.level) return;
    const dpad = document.getElementById("dpad");
    const chrome = 300 + (dpad.offsetParent ? dpad.offsetHeight + 14 : 0);
    const availW = Math.min(document.body.clientWidth - 28, 620) - 20;
    const availH = Math.max(window.innerHeight - chrome, 170);
    const size = Math.floor(Math.min(availW / state.level.w, availH / state.level.h));
    // Small enough that the widest library levels (30 across) still fit a phone.
    el.board.style.setProperty("--cell", Math.max(8, Math.min(56, size)) + "px");
  }

  /* ---------- deadlock detection (sound, but deliberately conservative) ---------- */

  function isStuck() {
    const filled = (x, y) => isWall(x, y) || at(state.boxes, x, y) >= 0;

    for (const b of state.boxes) {
      if (isGoal(b.x, b.y)) continue;

      // Wedged into a corner: no push can ever move it again.
      const vert = isWall(b.x, b.y - 1) || isWall(b.x, b.y + 1);
      const horiz = isWall(b.x - 1, b.y) || isWall(b.x + 1, b.y);
      if (vert && horiz) return true;

      // Part of a solid 2x2 block of walls/crates: every member is frozen.
      for (const [ox, oy] of [[-1, -1], [-1, 0], [0, -1], [0, 0]]) {
        const x = b.x + ox, y = b.y + oy;
        if (filled(x, y) && filled(x + 1, y) && filled(x, y + 1) && filled(x + 1, y + 1)) return true;
      }
    }
    return false;
  }

  /* ---------- sound ---------- */

  let audio = null;

  function tone(freq, duration, type, gain, delay) {
    if (!soundOn) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const t0 = audio.currentTime + (delay || 0);
      const osc = audio.createOscillator();
      const vol = audio.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      vol.gain.setValueAtTime(0.0001, t0);
      vol.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
      vol.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(vol).connect(audio.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    } catch (e) {
      soundOn = false;
    }
  }

  const sfx = {
    step:  () => tone(196, 0.05, "triangle", 0.05),
    push:  () => tone(110, 0.11, "sawtooth", 0.045),
    place: () => tone(784, 0.16, "sine", 0.09),
    bump:  () => tone(70, 0.09, "square", 0.035),
    win:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.24, "sine", 0.09, i * 0.09))
  };

  /* ---------- gameplay ---------- */

  function move(dirName) {
    if (state.won || !state.level) return;
    const dir = DIRS[dirName];
    if (!dir) return;

    notice = null;
    state.facing = dirName;

    const nx = state.player.x + dir.dx;
    const ny = state.player.y + dir.dy;

    if (isWall(nx, ny)) {
      state.playerEl.className = "ent player face-" + state.facing;
      bump();
      return;
    }

    const hit = at(state.boxes, nx, ny);
    let pushed = false;

    if (hit >= 0) {
      const bx = nx + dir.dx;
      const by = ny + dir.dy;
      if (isWall(bx, by) || at(state.boxes, bx, by) >= 0) {
        state.playerEl.className = "ent player face-" + state.facing;
        bump();
        return;
      }
      state.history.push({ player: { ...state.player }, box: hit, from: { ...state.boxes[hit] }, facing: state.facing });
      state.boxes[hit] = { x: bx, y: by };
      pushed = true;
    } else {
      state.history.push({ player: { ...state.player }, box: -1, facing: state.facing });
    }

    state.player = { x: nx, y: ny };
    state.moves++;
    if (pushed) state.pushes++;

    const landedOnGoal = pushed && isGoal(state.boxes[hit].x, state.boxes[hit].y);
    if (landedOnGoal) sfx.place();
    else if (pushed) sfx.push();
    else sfx.step();

    drawEntities(false);
    updateHud();

    if (state.boxes.every(b => isGoal(b.x, b.y))) win();
  }

  function bump() {
    sfx.bump();
    state.playerEl.classList.remove("nudge");
    void state.playerEl.offsetWidth;
    state.playerEl.classList.add("nudge");
  }

  function undo() {
    if (state.won || !state.history.length) return;
    notice = null;
    const last = state.history.pop();
    state.player = last.player;
    state.facing = last.facing;
    if (last.box >= 0) {
      state.boxes[last.box] = last.from;
      state.pushes--;
    }
    state.moves--;
    drawEntities(false);
    updateHud();
    sfx.step();
  }

  function win() {
    state.won = true;
    sfx.win();
    state.playerEl.classList.add("cheer");

    const key = progKey(state.col, state.index);
    const best = progress[key];
    const beaten = !best || state.moves < best.moves;
    if (beaten) progress[key] = { moves: state.moves, pushes: state.pushes };
    saveProgress();

    const level = state.level;
    const last = state.index === state.col.count - 1;
    el.winTitle.textContent = last ? "All levels cleared!" : "Level complete!";
    el.winDetail.textContent = `${plural(state.moves, "move")} · ${plural(state.pushes, "push", "es")}`;
    el.winMedal.textContent =
      level.par != null && state.pushes <= level.par ? "Perfect — matched par!" :
      beaten ? "New personal best" : "";
    el.overlay.classList.add("show");
    document.getElementById("nextLevel").textContent = last ? "Back to Level 1" : "Next Level";
    document.getElementById("nextLevel").focus();

    updateHud();
    markThumbs();
  }

  function updateHud() {
    const best = progress[progKey(state.col, state.index)];
    el.statLevelLabel.textContent = state.col.short;
    el.statLevel.textContent = fmt(state.index + 1);
    el.statMoves.textContent = state.moves;
    el.statPushes.textContent = state.pushes;
    el.statPar.textContent = state.level.par ?? "—";
    el.statBest.textContent = best ? best.moves + " mv" : "—";
    el.undo.disabled = state.won || state.history.length === 0;

    if (state.won) {
      el.hint.className = "";
      el.hint.textContent = "Solved!";
    } else if (notice) {
      el.hint.className = notice.warn ? "stuck" : "";
      el.hint.textContent = notice.text;
    } else if (isStuck()) {
      el.hint.className = "stuck";
      el.hint.textContent = "That crate is stuck — undo (U) or restart (R)";
    } else {
      el.hint.className = "";
      el.hint.innerHTML = '<span class="keys">Arrow keys or WASD to move · swipe on the board on touch</span>';
    }
  }

  function start(col, index, def) {
    state.col = col;
    state.index = index;
    state.def = def;
    state.level = parseLevel(def);
    state.boxes = state.level.boxes.map(b => ({ ...b }));
    state.player = { ...state.level.player };
    state.facing = "down";
    state.moves = 0;
    state.pushes = 0;
    state.history = [];
    state.won = false;
    notice = null;

    el.overlay.classList.remove("show");
    buildBoard();
    updateHud();
    markThumbs();

    const where = col.name + " · level " + fmt(index + 1) + " of " + fmt(col.count);
    el.subtitle.textContent = where + (def.name ? " · " + def.name : "");
    document.title = "Sokoban · " + col.short + " " + fmt(index + 1);

    showAddress();
  }

  // The address names the level, so a bookmark or a shared link returns to it.
  function showAddress() {
    const col = state.col;
    try {
      history.replaceState(null, "", col.file ? location.pathname + location.search : "#" + col.id + "/" + (state.index + 1));
    } catch (e) {
      /* some browsers refuse this on file:// pages */
    }
  }

  // Only the latest request may start a level: a set that arrives late, after
  // the player has asked for something else, is dropped.
  let asked = 0;

  function go(col, index, quiet) {
    index = ((index % col.count) + col.count) % col.count;
    const mine = ++asked;
    const slow = setTimeout(() => say("Loading " + col.name + " " + fmt(index + 1) + "…"), 150);

    return col.load(Math.floor(index / SET)).then(defs => {
      clearTimeout(slow);
      if (mine !== asked) return false;
      const def = defs[index % SET];
      if (!def) throw new Error("no such level");
      start(col, index, def);
      if (!quiet) {
        progress.at[col.id] = index;
        if (!col.file) progress.last = col.id;
        saveProgress();
      }
      return true;
    }).catch(() => {
      clearTimeout(slow);
      if (mine === asked) say("Couldn't load " + col.name + " " + fmt(index + 1) + ". It needs a connection the first time", true);
      return false;
    });
  }

  const step = by => go(state.col, state.index + by);
  const restart = () => start(state.col, state.index, state.def);

  /* ---------- level library browser ---------- */

  // Miniature of a raw level grid, drawn straight from its text rows.
  function drawThumb(canvas, def) {
    const w = Math.max.apply(null, def.rows.map(r => r.length));
    const h = def.rows.length;
    const s = 12;
    canvas.width = w * s;
    canvas.height = h * s;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#1e2342";
    ctx.fillRect(0, 0, w * s, h * s);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const c = def.rows[y][x] || " ";
        const cx = x * s + s / 2, cy = y * s + s / 2;
        if (c === "#") {
          ctx.fillStyle = "#3d4477";
          ctx.fillRect(x * s + 0.5, y * s + 0.5, s - 1, s - 1);
        } else if (c === "$" || c === "*") {
          ctx.fillStyle = c === "*" ? "#4ecb8d" : "#d69551";
          ctx.fillRect(x * s + 2, y * s + 2, s - 4, s - 4);
        } else if (c === "@" || c === "+") {
          ctx.fillStyle = "#38d9d3";
          ctx.beginPath();
          ctx.arc(cx, cy, s * 0.36, 0, 7);
          ctx.fill();
        } else if (c === ".") {
          ctx.fillStyle = "#ffd166";
          ctx.beginPath();
          ctx.arc(cx, cy, s * 0.2, 0, 7);
          ctx.fill();
        }
      }
    }
  }

  // What the library shows, which need not be what is being played: the
  // player can look through any collection and only moves on choosing a level.
  const view = { col: LIBRARY[0], set: 0, defs: [], asked: 0 };

  // Thumbnails are drawn only as they scroll into view: a set runs to a
  // thousand levels and painting them all up front would stall the open.
  let thumbIO = null;

  function openLibrary(col) {
    view.col = col || state.col;
    view.set = Math.floor((view.col === state.col ? state.index : progress.at[view.col.id] || 0) / SET);
    el.browser.classList.add("show");
    renderLibrary();
  }

  function closeLibrary() {
    el.browser.classList.remove("show");
    disarmWipe();
  }

  function renderLibrary() {
    const col = view.col;
    view.set = Math.max(0, Math.min(setsIn(col) - 1, view.set));

    el.chips.innerHTML = "";
    for (const c of collections()) {
      const chip = document.createElement("button");
      chip.className = "chip" + (c === col ? " active" : "");
      chip.textContent = c.name;
      const size = document.createElement("small");
      size.textContent = fmt(c.count);
      chip.appendChild(size);
      chip.addEventListener("click", () => openLibrary(c));
      el.chips.appendChild(chip);
      if (c === col) chip.scrollIntoView({ block: "nearest", inline: "nearest" });
    }

    el.about.textContent = col.about;
    el.setBar.hidden = setsIn(col) < 2;
    el.setSlider.max = setsIn(col);
    el.setSlider.value = view.set + 1;
    el.jumpTo.max = col.count;
    el.jumpTo.placeholder = "1 – " + fmt(col.count);
    el.jumpTo.value = "";
    disarmWipe();
    showRange(view.set);
    renderThumbs();
  }

  function showRange(k) {
    const col = view.col;
    const last = Math.min(col.count, (k + 1) * SET);
    el.where.textContent = setsIn(col) < 2
      ? fmt(col.count) + " levels"
      : "Levels " + fmt(k * SET + 1) + " – " + fmt(last) + " · set " + fmt(k + 1) + " of " + fmt(setsIn(col));
  }

  function showSet(k) {
    const sets = setsIn(view.col);
    view.set = ((k % sets) + sets) % sets;
    el.setSlider.value = view.set + 1;
    showRange(view.set);
    renderThumbs();
  }

  function renderThumbs() {
    const col = view.col, k = view.set, mine = ++view.asked;

    if (thumbIO) thumbIO.disconnect();
    el.thumbGrid.innerHTML = "";
    view.defs = [];
    el.empty.hidden = false;
    el.empty.textContent = "Loading…";
    markThumbs();

    col.load(k).then(defs => {
      if (mine !== view.asked) return;
      el.empty.hidden = true;
      view.defs = defs;

      thumbIO = new IntersectionObserver(entries => {
        for (const en of entries) {
          if (!en.isIntersecting) continue;
          thumbIO.unobserve(en.target);
          drawThumb(en.target.firstChild, defs[en.target.dataset.i % SET]);
        }
      }, { root: el.scroll, rootMargin: "300px" });

      const grid = document.createDocumentFragment();
      defs.forEach((def, j) => {
        const b = document.createElement("button");
        b.className = "thumb";
        b.dataset.i = k * SET + j;
        if (def.name) b.title = def.name;
        const c = document.createElement("canvas");
        // Reserve the miniature's shape now, so the grid does not jump as they are drawn.
        c.style.aspectRatio = Math.max.apply(null, def.rows.map(r => r.length)) + " / " + def.rows.length;
        b.append(c, document.createElement("small"));
        thumbIO.observe(b);
        grid.appendChild(b);
      });
      el.thumbGrid.appendChild(grid);
      el.scroll.scrollTop = 0;

      markThumbs();
      const here = el.thumbGrid.querySelector(".current");
      if (here) here.scrollIntoView({ block: "center" });
    }, () => {
      if (mine !== view.asked) return;
      el.empty.textContent = "These levels could not be downloaded. A set needs a connection the first time it is opened; after that it stays on this device.";
      const retry = document.createElement("button");
      retry.className = "btn";
      retry.textContent = "Try Again";
      retry.addEventListener("click", renderThumbs);
      el.empty.appendChild(retry);
    });
  }

  function markThumbs() {
    const col = view.col;
    for (const b of el.thumbGrid.children) {
      const i = +b.dataset.i;
      const best = progress[progKey(col, i)];
      const def = view.defs[i % SET];
      b.classList.toggle("done", !!best);
      b.classList.toggle("current", col === state.col && i === state.index);
      b.lastChild.textContent = fmt(i + 1) +
        (best ? " · " + best.moves + " mv" : def && def.par != null ? " · par " + def.par : "");
    }
    el.packInfo.textContent = fmt(countSolved(col)) + " / " + fmt(col.count) + " solved";
  }

  function play(col, index) {
    closeLibrary();
    return go(col, index);
  }

  function jump() {
    const n = Math.round(Number(el.jumpTo.value));
    if (!(n >= 1 && n <= view.col.count)) {
      el.jumpTo.value = "";
      el.jumpTo.focus();
      return;
    }
    play(view.col, n - 1);
  }

  // A level not solved yet, from anywhere in the collection.
  function playRandom() {
    const col = view.col;
    let pick = 0;
    for (let tries = 0; tries < 40; tries++) {
      pick = Math.floor(Math.random() * col.count);
      if (!progress[progKey(col, pick)]) break;
    }
    play(col, pick);
  }

  // Forgetting progress takes two presses, and only touches the collection on show.
  let wipeArmed = 0;

  function disarmWipe() {
    clearTimeout(wipeArmed);
    wipeArmed = 0;
    el.wipe.textContent = "Reset Progress";
  }

  function wipe() {
    if (!wipeArmed) {
      el.wipe.textContent = "Forget " + view.col.name + "?";
      wipeArmed = setTimeout(disarmWipe, 4000);
      return;
    }
    const stem = keyStem(view.col);
    for (const key of Object.keys(progress)) if (isBest(key, stem)) delete progress[key];
    saveProgress();
    disarmWipe();
    markThumbs();
    updateHud();
  }

  function openPackFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      const defs = parseLevelPack(reader.result);
      if (!defs.length) {
        closeLibrary();
        say(file.name + ": no Sokoban levels recognized", true);
        return;
      }
      opened = {
        id: file.name, name: file.name, short: "File", file: true, count: defs.length,
        about: "Opened from a file on this device. Its progress is kept under the file's name.",
        load: local(defs)
      };
      const left = progress.at[file.name] || 0;
      go(opened, left < defs.length ? left : 0).then(() => openLibrary(opened));
    };
    reader.readAsText(file);
  }

  /* ---------- input ---------- */

  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right"
  };

  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;

    if (el.browser.classList.contains("show")) {
      if (e.key === "Escape") closeLibrary();
      else if (e.key === "Enter" && e.target === el.jumpTo) jump();
      return;
    }

    const dir = KEYS[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
      return;
    }

    switch (e.key.toLowerCase()) {
      case "u":
      case "z":
      case "backspace":
        e.preventDefault();
        undo();
        break;
      case "r":
        restart();
        break;
      case "n":
        step(1);
        break;
      case "l":
        openLibrary();
        break;
      case "o":
        el.file.click();
        break;
      case "p":
        step(-1);
        break;
      case "enter":
        // The focused Next Level button would take this Enter as a click too.
        e.preventDefault();
        if (state.won) step(1);
        break;
    }
  });

  // Swipe support.
  let touchStart = null;
  el.board.addEventListener("touchstart", e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  el.board.addEventListener("touchend", e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.hypot(dx, dy) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });

  document.getElementById("dpad").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (btn) move(btn.dataset.dir);
  });

  el.undo.addEventListener("click", undo);
  document.getElementById("restart").addEventListener("click", restart);
  el.prev.addEventListener("click", () => step(-1));
  el.next.addEventListener("click", () => step(1));
  document.getElementById("nextLevel").addEventListener("click", () => {
    if (state.won) step(1);
  });

  document.getElementById("levels").addEventListener("click", () => openLibrary());
  document.getElementById("closeBrowser").addEventListener("click", closeLibrary);
  el.browser.addEventListener("click", e => {
    if (e.target === el.browser) closeLibrary();
  });

  el.thumbGrid.addEventListener("click", e => {
    const thumb = e.target.closest(".thumb");
    if (thumb) play(view.col, +thumb.dataset.i);
  });

  document.getElementById("setPrev").addEventListener("click", () => showSet(view.set - 1));
  document.getElementById("setNext").addEventListener("click", () => showSet(view.set + 1));
  // Dragging the slider only names the set under the thumb; letting go opens it.
  el.setSlider.addEventListener("input", () => showRange(el.setSlider.value - 1));
  el.setSlider.addEventListener("change", () => showSet(el.setSlider.value - 1));

  document.getElementById("jumpGo").addEventListener("click", jump);
  document.getElementById("random").addEventListener("click", playRandom);
  el.wipe.addEventListener("click", wipe);

  document.getElementById("open").addEventListener("click", () => el.file.click());
  document.getElementById("openMore").addEventListener("click", () => el.file.click());
  el.file.addEventListener("change", () => {
    if (el.file.files[0]) openPackFile(el.file.files[0]);
    el.file.value = "";
  });

  el.sound.addEventListener("click", () => {
    soundOn = !soundOn;
    progress.sound = soundOn;
    saveProgress();
    el.sound.textContent = soundOn ? "🔊" : "🔇";
    if (soundOn) sfx.place();
  });

  window.addEventListener("resize", fitBoard);

  /* ---------- go ---------- */

  // "#hard/1234" in the address names a level of the library.
  function named() {
    const m = /^#([a-z]+)\/(\d+)$/.exec(location.hash);
    const col = m && LIBRARY.find(c => c.id === m[1]);
    return col && +m[2] >= 1 && +m[2] <= col.count ? { col, index: m[2] - 1 } : null;
  }

  window.addEventListener("hashchange", () => {
    const to = named();
    if (!to || (to.col === state.col && to.index === state.index)) return;
    go(to.col, to.index).then(ok => {
      if (!ok && state.level) showAddress();
    });
  });

  el.sound.textContent = soundOn ? "🔊" : "🔇";

  // Open on the level in the address, else where the player left off. If that
  // level cannot be had (its set was never downloaded and there is no
  // connection), fall back on a built-in one and keep the place for next time.
  (function () {
    const last = LIBRARY.find(c => c.id === progress.last) || LIBRARY[0];
    const to = named() || { col: last, index: progress.at[last.id] || 0 };
    go(to.col, to.index).then(ok => {
      if (ok || state.level) return;
      const home = LIBRARY[0];
      go(home, progress.at[home.id] || 0, true).then(() =>
        say(to.col.name + " needs a connection the first time. Playing " + home.name + " for now", true));
    });
  })();

  // Offline: a service worker keeps the page itself once it has been visited.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !/[?&]nosw\b/.test(location.search)) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* offline support is optional */ });
  }
})();
</script>
</body>
</html>
