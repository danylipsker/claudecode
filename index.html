<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234d59c9'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1220;
    color: #e8eaf6;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 620px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: #969db8; font-size: 14px; margin: 0 0 22px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.app {
    display: block;
    padding: 16px 18px;
    border-radius: 10px;
    background: #181c2e;
    border: 1px solid #2a3050;
    color: inherit;
    text-decoration: none;
    transition: border-color .12s, background .12s, transform .05s;
  }
  a.app:hover { background: #1e2340; border-color: #6c7bff; }
  a.app:active { transform: translateY(1px); }
  a.app:focus-visible { outline: 2px solid #38d9d3; outline-offset: 2px; }
  a.app .name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
  a.app .desc { color: #969db8; font-size: 13.5px; margin-top: 5px; line-height: 1.45; }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 35%, #fff 0, #6c7bff 55%, #2a3aa0 100%);
  }
</style>
</head>
<body>
  <main>
    <h1>Apps</h1>
    <p class="sub">Things built in this repository that run in a browser.</p>
    <ul>
      <li>
        <a class="app" href="VECTOR-EDITOR/vector-editor.html">
          <span class="name"><span class="dot" aria-hidden="true"></span>VectorLab</span>
          <span class="desc">A vector drawing editor.</span>
        </a>
      </li>
      <li>
        <a class="app" href="GALAXIES/index.html">
          <span class="name"><span class="dot" aria-hidden="true"></span>Galaxies</span>
          <span class="desc">Nikoli&rsquo;s Tentai Show, with puzzles generated on the spot and a hint that explains itself.</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
