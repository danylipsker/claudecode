<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyper Medicine</title>
<meta name="description" content="The human body in health and disease: how every system works, what goes wrong and why, diagnosis, evidence, prevention and first aid — explained, with simulations, a body map and medical calculators.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28S4 20.6 4 12.4A6.6 6.6 0 0 1 16 8.4a6.6 6.6 0 0 1 12 4C28 20.6 16 28 16 28z' fill='%23e0425a'/%3E%3Cpath d='M5 15.5h6l2-4 3.5 8 2.5-4h8' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../HYPER-CORE/css/hyper.css">
<script>
  // the theme before the first paint, so a dark page never flashes white
  try {
    var t = (JSON.parse(localStorage.getItem('hyper:settings') || '{}').theme) || 'auto';
    document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<noscript><p style="padding:2em">Hyper Medicine needs JavaScript switched on.</p></noscript>

<!-- engine -->

<script src="../HYPER-CORE/js/tex.js"></script>

<!-- titles of the sibling disciplines, for links and search -->

<script src="../HYPER-MATH/catalog.js"></script>
<script src="../HYPER-ELECTRONICS/catalog.js"></script>
<script src="../HYPER-CHEMISTRY/catalog.js"></script>
<script src="../HYPER-FINANCES/catalog.js"></script>

<script>
  // ?extra=content/new.js,sims/new.js loads files not listed above yet (for previewing new content)
  (function () {
    var extra = (new URLSearchParams(location.search).get('extra') || '').split(',').filter(function (s) { return /^(content|sims)\/[\w.-]+\.js$/.test(s); });
    (function next() {
      if (!extra.length) return Hyper.start({ discipline: 'medicine' });
      var s = document.createElement('script');
      s.src = extra.shift(); s.onload = s.onerror = next;
      document.body.appendChild(s);
    })();
  })();
</script>
