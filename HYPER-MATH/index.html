<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyper Math</title>
<meta name="description" content="The mathematics of science as a web of connected ideas: explanations, live formulas you can solve for any variable, simulations and practice.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 22 16 9l8 12z' fill='none' stroke='%232ec4a6' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='9' r='5' fill='%232ec4a6'/%3E%3Ccircle cx='8.5' cy='22.5' r='4' fill='%233ccf8e'/%3E%3Ccircle cx='24' cy='21.5' r='4' fill='%23ff7a8a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../HYPER-CORE/css/hyper.css">
<script>
  // the theme before the first paint, so a dark page never flashes white
  try {
    var t = (JSON.parse(localStorage.getItem('hyper:settings') || '{}').theme) || 'auto';
    document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<noscript><p style="padding:2em">Hyper Math needs JavaScript switched on.</p></noscript>

<!-- titles of the sibling disciplines, for links and search -->
<script src="../HYPER-PHYSICS/catalog.js"></script>

<script>
  // ?extra=content/new.js,sims/new.js loads files not listed above yet (for previewing new content)
  (function () {
    var extra = (new URLSearchParams(location.search).get('extra') || '').split(',').filter(function (s) { return /^(content|sims)\/[\w.-]+\.js$/.test(s); });
    (function next() {
      if (!extra.length) return Hyper.start({ discipline: 'math' });
      var s = document.createElement('script');
      s.src = extra.shift(); s.onload = s.onerror = next;
      document.body.appendChild(s);
    })();
  })();
</script>
