<link rel="stylesheet" href="css/drive.css">
<script>
  // language, direction and theme before the first paint (no flash of the wrong layout)
  try {
    var s = JSON.parse(localStorage.getItem('drive:settings') || '{}');
    var t = s.theme || 'auto';
    document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
    if (s.lang === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
    if (s.fontScale) document.documentElement.style.setProperty('--fs', s.fontScale);
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<div id="app"><p style="padding:2em;text-align:center;color:#888">טוען… · Loading…</p></div>
