</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Q is a point carried by the curve; its polar axis is QO1, and its radius vector to the contact point is r = QP. The angle θ at Q between QO1 and QP is the polar angle of the contact point: the curve is r = f(θ).">
