<text class="lbl  upright" x="930.61" y="563.7" font-size="33.28" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">(x, y)</text>
</g>
<g class="step" data-step="1" data-tool="compass" data-text="The circle of curvature at (x, y): the circle that touches the curve there and has the same curvature, radius R. Its centre (α, β) is the centre of curvature.">
<circle class="ink given" style="stroke-width:4.15;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="652.83" cy="430.84" r="283"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.53" cx="652.83" cy="430.84" r="5.99"/>
<text class="lbl  upright" x="652.83" y="392.01" font-size="33.28" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">(α, β)</text>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Join the centre to (x, y): this is the normal, of length R. Drop the perpendicular from (α, β) to OX and the horizontal from (x, y) to it: they make a right triangle with hypotenuse R.">
<path class="ink given" style="stroke-width:4.15;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M652.83 430.84L902.7 563.7"/>
<path class="ink given" style="stroke-width:4.15;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M652.83 430.84L652.83 830.7"/>
<path class="ink given" style="stroke-width:4.15;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M652.83 563.7L902.7 563.7"/>
<text class="lbl  upright" x="802.52" y="468.14" font-size="35.23" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">R</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.53" cx="652.83" cy="430.84" r="5.99"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.53" cx="902.7" cy="563.7" r="6.74"/>
</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="Draw the tangent at (x, y), inclined at φ to OX.">
<path class="ink given" style="stroke-width:4.15;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M734.91 879.26L902.7 563.7"/>
</g>
<g class="step" data-step="4" data-tool="note" data-text="The tangent makes the angle φ with OX, and so does the normal with the vertical: the angle at (α, β) is φ. From the triangle α = x − R sin φ and β = y + R cos φ.">
<path class="ink given" style="fill:none;stroke:#1b1b1b;stroke-width:2.53" d="M652.83 483.69A52.85 52.85 0 0 0 699.49 455.65"/>
<text class="lbl given" x="704.24" y="516.41" font-size="39.15" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">φ</text>
<path class="ink given" style="fill:none;stroke:#1b1b1b;stroke-width:2.53" d="M817.11 830.7A56.37 56.37 0 0 0 787.2 780.93"/>
<text class="lbl given" x="846.8" y="778.98" font-size="39.15" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">φ</text>
<text class="lbl  upright" x="730.7" y="910.7" font-size="35.23" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">α = x − R sin φ</text>
<text class="lbl  upright" x="730.7" y="980.7" font-size="35.23" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">β = y + R cos φ</text>
</g>
</svg>
