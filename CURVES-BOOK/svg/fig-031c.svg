<title>Fig. 31(c) — Focus and directrix: the hyperbola (e &gt; 1), polar form with a vertical directrix</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 31(c), page 36. Section: conics.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
