</g>
<g class="step" data-step="2" data-tool="compass" data-text="P is the tracing point, at the distance AP = OA = a − b from A (drawn with the compass about A). Join A to P and O to P: the triangle OAP is isosceles, so its angles at O and P are equal, α + θ, where θ is the angle of OP with the initial line, below it.">
