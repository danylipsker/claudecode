<text class="lbl " x="135.26" y="217.14" font-size="11.69" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">r</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.76" d="M87.1 209.03A23.15 23.15 0 0 0 88.5 201.11"/>
<text class="lbl " x="98.51" y="206.96" font-size="11.69" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.76" d="M175.74 228.69A13.68 13.68 0 0 0 165.26 237.48"/>
<text class="lbl " x="158.05" y="218.24" font-size="11.69" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">α+θ</text>
</g>
<g class="step" data-step="3" data-tool="note" data-text="At A the angle β between AB and AP is 2(α + θ); rolling without slipping gives aα = bβ, hence α = 2bθ / (a − 2b).">
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.76" d="M159.1 134.34A10.52 10.52 0 0 0 165.34 117.22"/>
<text class="lbl " x="181.17" y="132.68" font-size="11.69" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">β</text>
</g>
<g class="step" data-step="4" data-tool="pencil" data-text="The path of P in polar coordinates: r = 2(a − b) cos(α + θ) = 2(a − b) cos(aθ/(a − 2b)). The little stub left of O is the continuation through the pole, and the arrow shows the direction of tracing.">
