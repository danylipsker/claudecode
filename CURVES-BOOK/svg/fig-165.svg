</g>
<g class="step" data-step="2" data-tool="square" data-text="From the contact point P drop the perpendicular PQ = z on the diameter. Q is the point where the diameter touches its envelope. Here z = a sin φ.">
<path class="ink given" style="stroke-width:5.76;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M759.18 868.28L646.03 520.04"/>
