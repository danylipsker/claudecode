</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="The carried line is a diameter of the circle (the thick line through its centre, turned through the angle φ since the start).">
<path class="ink thick" style="stroke-width:8.96;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M393.03 602.25L1125.34 364.31"/>
