<text class="lbl " x="637.67" y="780" font-size="54.42" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">φ</text>
</g>
<g class="step" data-step="3" data-tool="pencil" data-text="The envelope is the locus of Q, an ordinary cycloid: from ds/dφ = a and z = a sin φ, dσ/dφ = 2a sin φ, that is σ = −2a cos φ. It starts with a cusp at O.">
