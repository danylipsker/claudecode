<g class="step" data-step="3" data-tool="note" data-text="Q, O and P are always on one line (the rhombus is symmetric about it), and (OQ)(QP) = L² − s² = k². With OQ = 2c cos θ and QP = 2c cos θ + r this gives the polar equation of the path of P.">
