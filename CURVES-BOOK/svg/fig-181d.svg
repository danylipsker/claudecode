<g class="step" data-step="1" data-tool="straightedge" data-text="The asymptotes: y² = (x − 1)³/x ≈ (x − 3/2)² for large |x|, so y = ±(x − 3/2): two lines through (3/2, 0). The y-axis (x = 0) is also an asymptote, since y → ∞ as x → 0 from the left. Draw them.">
