</g>
<g class="step" data-step="2" data-tool="pencil" data-text="Draw the curve: for x ≥ 1 two branches meeting in a cusp at (1, 0) (y ≈ ±(x − 1)^(3/2)) and approaching the oblique asymptotes; for x &lt; 0 two branches, each coming down the y-axis and bending out along an oblique asymptote.">
