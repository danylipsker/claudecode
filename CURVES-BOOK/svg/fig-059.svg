<text class="lbl " x="272.51" y="35.73" font-size="13.14" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="4" data-tool="square" data-text="From P draw the perpendicular to OB. It cuts the unit circle at T and OB at the distance x = cos θ from O.">
<path class="ink given" style="stroke-width:1.39;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M264.36 23.73L264.36 333.51"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.85" cx="264.36" cy="291.24" r="3.52"/>
<text class="lbl " x="271.29" y="283.1" font-size="13.14" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">T</text>
<text class="lbl " x="242.73" y="324.51" font-size="13.14" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">x</text>
</g>
<g class="step" data-step="5" data-tool="straightedge" data-text="Join O to T and carry the line on. OT is the trisecting line: the angle BOT is θ, a third of the angle AOB.">
<path class="ink given" style="stroke-width:1.39;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M173.73 333.51L301.52 273.92"/>
