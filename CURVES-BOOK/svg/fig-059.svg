<g class="step" data-step="2" data-tool="straightedge" data-text="Draw the fixed line L of slope 3 through (−1, 0) and (0, 3).">
<path class="ink given" style="stroke-width:1.39;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M73.73 333.51L173.73 33.51"/>
