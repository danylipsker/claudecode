<text class="lbl  upright" x="110.73" y="171.51" font-size="13.14" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">L</text>
</g>
<g class="step" data-step="3" data-tool="square" data-text="Through the point (0, a) on OY draw the parallel to L, which has slope 3: its equation is y − 3x − a = 0. It meets the curve at P, and the abscissa of P is cos θ.">
<path class="ink given" style="stroke-width:1.39;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M165.1 333.51L264.36 35.73"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.85" cx="173.73" cy="307.62" r="3.52"/>
