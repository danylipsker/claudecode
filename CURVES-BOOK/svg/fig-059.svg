</g>
<g class="step" data-step="1" data-tool="pencil" data-text="Draw the cubic parabola y = 4x³ (once drawn it serves for every angle). With x = cos θ, cos 3θ = 4cos³θ − 3cos θ turns into 4x³ − 3x − a = 0.">
