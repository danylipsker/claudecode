<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The angle AOB = 3θ with OA a radius of the unit circle. The projection of A on OB is a = cos 3θ.">
<path class="ink given" style="stroke-width:1.39;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M23.73 333.51L173.73 333.51"/>
