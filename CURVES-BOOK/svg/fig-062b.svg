<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 472.14 257.98" width="520" height="284" data-fig="fig-062b">
<title>Fig. 62(b) — Point-by-point construction of the cycloid</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 62(b), page 65. Section: cycloid.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The base line with the starting point O and the point H, where OH = πa is the half circumference of the generating circle of radius a.">
<path class="ink given" style="stroke-width:1.7;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M28.99 228.99L443.15 228.99"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="98.99" cy="228.99" r="3.07"/>
<text class="lbl " x="98.99" y="238.94" font-size="16.05" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">O</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="413.15" cy="228.99" r="3.07"/>
<text class="lbl " x="413.15" y="238.94" font-size="16.05" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">H</text>
</g>
<g class="step" data-step="1" data-tool="square" data-text="At H raise the perpendicular HN = 2a, the diameter of the generating circle in its highest position.">
<path class="ink given" style="stroke-width:1.7;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M413.15 228.99L413.15 28.99"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="413.15" cy="28.99" r="3.07"/>
<text class="lbl " x="413.15" y="19.04" font-size="16.05" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">N</text>
</g>
<g class="step" data-step="2" data-tool="compass" data-text="About the middle C of HN draw the semicircle NH on the side of O, with radius a.">
<path class="ink given" style="stroke-width:1.7;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M413.15 28.99A100 100 0 0 0 413.15 228.99"/>
</g>
<g class="step" data-step="3" data-tool="dividers" data-text="Divide the semicircle NH into equal parts (four here): the division points 1, 2, 3, counted from N. Join them to the centre C.">
<path class="ink cons" style="stroke-width:1.04;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M413.15 128.99L342.44 58.28"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="342.44" cy="58.28" r="3.07"/>
<text class="lbl  upright" x="350.9" y="48.33" font-size="12.84" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">1</text>
<path class="ink cons" style="stroke-width:1.04;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M413.15 128.99L313.15 128.99"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="313.15" cy="128.99" r="3.07"/>
<text class="lbl  upright" x="321.61" y="119.04" font-size="12.84" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">2</text>
<path class="ink cons" style="stroke-width:1.04;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M413.15 128.99L342.44 199.7"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="342.44" cy="199.7" r="3.07"/>
<text class="lbl  upright" x="350.9" y="189.75" font-size="12.84" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">3</text>
</g>
<g class="step" data-step="4" data-tool="dividers" data-text="Divide the base OH into the same number of equal parts and number the points 1, 2, 3 from H towards O.">
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="334.61" cy="228.99" r="3.07"/>
<text class="lbl  upright" x="334.61" y="238.94" font-size="12.84" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">1</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="256.07" cy="228.99" r="3.07"/>
<text class="lbl  upright" x="256.07" y="238.94" font-size="12.84" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">2</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="177.53" cy="228.99" r="3.07"/>
<text class="lbl  upright" x="177.53" y="238.94" font-size="12.84" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">3</text>
</g>
<g class="step" data-step="5" data-tool="square" data-text="Through the points 1, 2, 3 of the semicircle draw the horizontals, running to the left.">
<path class="ink given" style="stroke-width:1.7;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M342.44 58.28L263.9 58.28"/>
<path class="ink given" style="stroke-width:1.7;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M313.15 128.99L156.07 128.99"/>
<path class="ink given" style="stroke-width:1.7;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M342.44 199.7L140.82 199.7"/>
</g>
<g class="step" data-step="6" data-tool="compass" data-text="Open the compass to H1 (the distance from H to the point 1 of the base) and strike an arc about the point 1 of the semicircle: it cuts the horizontal at P1. Likewise 2P2 = H2 and 3P3 = H3.">
<path class="ink cons" style="stroke-width:1.04;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M265.52 42.39A78.54 78.54 0 0 0 265.52 74.17"/>
