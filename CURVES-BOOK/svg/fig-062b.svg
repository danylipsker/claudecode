<text class="lbl " x="255.44" y="48.33" font-size="16.05" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<path class="ink cons" style="stroke-width:1.04;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M156.88 113.02A157.08 157.08 0 0 0 156.88 144.96"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="156.07" cy="128.99" r="3.07"/>
<text class="lbl " x="147.61" y="119.04" font-size="16.05" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
<path class="ink cons" style="stroke-width:1.04;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M107.36 183.71A235.62 235.62 0 0 0 107.36 215.69"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.04" cx="106.82" cy="199.7" r="3.07"/>
<text class="lbl " x="116.77" y="199.7" font-size="16.05" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P<tspan baseline-shift="sub" font-size="70%">3</tspan></text>
</g>
