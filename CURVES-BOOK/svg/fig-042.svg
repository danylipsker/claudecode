<text class="lbl " x="271.79" y="670.07" font-size="45.36" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">X</text>
</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="Draw the Pascal line through X and Z (heavy); it meets 1',3 at Y.">
<path class="ink given" style="stroke-width:4.8;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M818.43 104.86L264.43 962.86"/>
