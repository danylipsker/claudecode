<text class="lbl " x="390.97" y="115.49" font-size="45.36" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">2'</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.94" cx="264.43" cy="962.86" r="8.67"/>
<text class="lbl " x="303.81" y="962.86" font-size="45.36" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">3</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.94" cx="818.43" cy="104.86" r="8.67"/>
<text class="lbl " x="818.43" y="65.49" font-size="45.36" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">1'</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.94" cx="669.43" cy="942.86" r="8.67"/>
<text class="lbl " x="702.9" y="982.23" font-size="45.36" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">1 = 3'</text>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Draw 1,2' and 1',2: they meet at Z.">
