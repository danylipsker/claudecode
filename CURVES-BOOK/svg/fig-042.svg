<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="Five points of a conic: 1 and 3' are taken together (1 = 3'), so the line 1,3' is the tangent at 1. The others are 2, 3, 1', 2'.">
