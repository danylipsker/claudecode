</g>
<g class="step" data-step="4" data-tool="straightedge" data-text="The line from Y to the point 1 = 3' is the required tangent (heavy). The tangent at any other of the five points is found in the same way.">
<path class="ink given" style="stroke-width:5.5;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M89.56 1233.7L910.78 821.81"/>
</g>
<g class="step" data-step="5" data-tool="note" data-text="The conic through the five points (dashed): the line just drawn touches it at 1 = 3'.">
