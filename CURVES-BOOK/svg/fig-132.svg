</g>
<g class="step" data-step="2" data-tool="compass" data-text="Choose a circle of inversion about O (the book does not draw it).">
<circle class="ink aux dash" style="stroke-width:1.96;fill:none;--dash:13.06 8.71;stroke:#8a8a8a;stroke-dasharray:13.06 8.71;stroke-linecap:round;stroke-linejoin:round" cx="651.85" cy="448.86" r="353.55"/>
</g>
<g class="step" data-step="3" data-tool="pencil" data-text="Invert the three enlarged circles. The two that pass through O become parallel straight lines (perpendicular to the line of centres); the third becomes a circle. The circle tangent to these two lines and this circle is easy to draw with straightedge and compass.">
<path class="ink curve" style="stroke-width:6.1;fill:none;stroke:#0b4fa0;stroke-linecap:round;stroke-linejoin:round" d="M66.85 117.79L1021.85 124.06"/>
<path class="ink curve" style="stroke-width:6.1;fill:none;stroke:#0b4fa0;stroke-linecap:round;stroke-linejoin:round" d="M71.85 680.01L1006.85 686.15"/>
<circle class="ink curve" style="stroke-width:6.1;fill:none;stroke:#0b4fa0;stroke-linecap:round;stroke-linejoin:round" cx="295.93" cy="413.59" r="142.8"/>
</g>
<g class="step" data-step="4" data-tool="note" data-text="To finish: invert the circle tangent to the two lines and the circle (with respect to the same circle of inversion), then change its radius by a. The result touches the three given circles.">

</g>
