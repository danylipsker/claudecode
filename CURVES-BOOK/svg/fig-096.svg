<title>Fig. 96 — A function equal to +1 and −1 on alternate intervals, undefined at the integers</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 96, page 103. Section: discontinuous.</desc>
