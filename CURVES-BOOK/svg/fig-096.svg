<text class="lbl  upright" x="180.07" y="199.87" font-size="10.57" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">−1</text>
</g>
<g class="step" data-step="1" data-tool="pencil" data-text="Where sin πx &gt; 0 (x between 0 and 1, between 2 and 3, between −2 and −1) the limit is 1: (1 + sin πx)^t grows without bound. Where sin πx &lt; 0 (between 1 and 2, between −1 and 0) the powers tend to 0 and the limit is −1. At every integer the quotient is 0/0: the value is undefined, so each end of each piece is open.">
