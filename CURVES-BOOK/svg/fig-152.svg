<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:3.16" cx="109.96" cy="587.21" r="12.54"/><circle class="pt" style="fill:#1b1b1b" cx="109.96" cy="587.21" r="5.13"/>
<path class="ink given" style="stroke-width:3.16;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M109.96 587.21L149.96 159.21"/>
