</g>
<g class="step" data-step="3" data-tool="protractor" data-text="The angle θ0 is the direction of the perpendicular from the initial line. In the triangle formed by r, the perpendicular and the tangent, ψ + (θ − θ0) = π/2.">
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.93" d="M252.15 587.21A142.2 142.2 0 0 0 189.22 469.15"/>
<text class="lbl " x="247.28" y="514" font-size="29.81" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ<tspan baseline-shift="sub" font-size="70%">0</tspan></text>
</g>
