</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Draw the tangent at X. It makes the angle ψ with the radius vector, where tan ψ = r dθ/dr.">
<path class="ink given" style="stroke-width:3.16;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M91.01 119.63L787.42 587.21"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.93" d="M144.96 212.63A53.66 53.66 0 0 0 194.51 189.12"/>
<text class="lbl " x="183.51" y="229.9" font-size="29.81" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">ψ</text>
</g>
<g class="step" data-step="2" data-tool="square" data-text="From O drop the perpendicular on the tangent. Its foot has the polar coordinates (r0, θ0): r0 = r sin ψ.">
<path class="ink given" style="stroke-width:3.16;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M109.96 587.21L320.46 273.68"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.93" cx="320.46" cy="273.68" r="5.7"/>
