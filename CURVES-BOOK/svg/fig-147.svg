<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 912 690.84" width="520" height="394" data-fig="fig-147">
<title>Fig. 147 — Definition of a parallel curve: the points Q and Q' at distance k on the normal</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 147, page 155. Section: parallel.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="A curve and a point P of it.">
<path class="ink thick" style="stroke-width:5.11;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M528.43 634.84A2500 2500 0 0 0 367.9 56"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.01" cx="456" cy="306.83" r="8.89"/>
<text class="lbl " x="472.34" y="287.61" font-size="31.01" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Draw the normal to the curve at P: the line through P perpendicular to the tangent.">
<path class="ink given" style="stroke-width:3.28;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M56 423.83L856 189.83"/>
</g>
<g class="step" data-step="2" data-tool="dividers" data-text="Lay off the distance k along the normal from P, once on each side: this gives Q and Q'.">
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.01" cx="856" cy="189.83" r="8.89"/>
<text class="lbl " x="856" y="170.61" font-size="31.01" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">Q</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.01" cx="56" cy="423.83" r="8.89"/>
<text class="lbl " x="39.66" y="404.61" font-size="31.01" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">Q'</text>
</g>
<g class="step" data-step="3" data-tool="note" data-text="Do this at every point P of the curve: Q and Q' run along the two branches of the curve parallel to the given one (the distances are k and −k).">
<text class="lbl " x="649.21" y="225.12" font-size="31.01" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">k</text>
<text class="lbl " x="249.21" y="342.12" font-size="31.01" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">−k</text>
</g>
</svg>
