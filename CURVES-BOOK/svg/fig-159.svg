</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="The normals of the two curves at T coincide; the normal of the rolling curve at O meets it at the angle φ1 (the angle through which the rolling curve has turned). That second normal makes the angle φ + φ1 with OX.">
