<text class="lbl " x="310.03" y="643.38" font-size="31.62" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">x<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
