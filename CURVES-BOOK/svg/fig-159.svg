</g>
<g class="step" data-step="4" data-tool="square" data-text="The coordinates (x1, y1) of T: drop the perpendicular from T on OX. The coordinates (u, v) of T referred to the tangent and normal at O: drop the perpendicular v from T on the normal at O; u is the piece from O to its foot.">
