<text class="lbl " x="621.82" y="672.45" font-size="49.31" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">u</text>
<text class="lbl " x="947.4" y="641.87" font-size="49.31" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">v</text>
<text class="lbl  upright" x="901.29" y="917.06" font-size="39.45" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">CP' = r</text>
</g>
<g class="step" data-step="3" data-tool="note" data-text="The equal angles θ: the crease bisects the angle between the focal radii QP and QC, so it is the tangent at Q.">
