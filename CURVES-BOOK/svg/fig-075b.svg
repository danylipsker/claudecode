<path class="ink thick" style="stroke-width:8.12;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M529.49 278.2L1123.83 951.65"/>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Draw P'C and extend it beyond C until it cuts the crease at Q; join Q to P. Now QP = QP' = u and QC = v, and u − v = P'C = r.">
