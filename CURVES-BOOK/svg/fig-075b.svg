<circle class="pt" style="fill:#1b1b1b" cx="311.29" cy="549.06" r="16.03"/>
<text class="lbl " x="311.29" y="518.48" font-size="49.31" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="1" data-tool="fold" data-text="Choose a point P' on the circle and fold P over onto P': the crease is the perpendicular bisector of PP'.">
<path class="ink cons dash" style="stroke-width:3.19;fill:none;--dash:17.4 11.6;stroke:#4b4b4b;stroke-dasharray:17.4 11.6;stroke-linecap:round;stroke-linejoin:round" d="M311.29 549.06L825.37 95.36"/>
