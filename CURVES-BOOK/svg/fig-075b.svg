<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 1450.35 1098.11" width="520" height="394" data-fig="fig-075b">
<title>Fig. 75(b) — Folding a point outside a circle onto the circle: the creases envelope a hyperbola</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 75(b), page 78. Section: envelopes.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
