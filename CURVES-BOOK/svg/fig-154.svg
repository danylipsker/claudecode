<path class="ink axis" style="stroke-width:3.13;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M138.98 977.95L138.98 109.95"/>
<path class="head axis" style="stroke:none;fill:#1b1b1b" d="M138.98 109.95L130.79 129.44L147.16 129.44Z"/>
<text class="lbl axis" x="933.98" y="877.2" font-size="35.43" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">X</text>
<text class="lbl axis" x="153.91" y="92.38" font-size="35.43" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">Y</text>
<path class="ink thick" style="stroke-width:5.83;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M473.31 498.57L477.43 491.86L481.39 485.05L485.2 478.16L488.85 471.18L492.35 464.13L495.68 456.99L498.86 449.79L501.87 442.51L504.71 435.17L507.39 427.76L509.91 420.3L512.25 412.78L514.43 405.22L516.43 397.6L518.27 389.94L519.92 382.24L521.41 374.51L522.72 366.75L523.86 358.95L524.82 351.14L525.61 343.3L526.21 335.45L526.65 327.59L526.9 319.72L526.98 311.84L526.88 303.97L526.6 296.1L526.15 288.24L525.52 280.39L524.71 272.55L523.73 264.74L522.57 256.95L521.24 249.19L519.73 241.46L518.05 233.77L516.19 226.11L514.17 218.5L511.97 210.94L509.61 203.43L507.07 195.97L504.37 188.58L501.5 181.24L498.47 173.97L495.28 166.78L491.92 159.65L488.41 152.61L484.74 145.64L480.91 138.76L476.93 131.96L472.79 125.26L468.51 118.65L464.08 112.14L459.5 105.73L454.78 99.43L449.92 93.23L444.92 87.15L439.79 81.18L434.52 75.32L429.13 69.59L423.6 63.98"/>
<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:3.75" cx="138.98" cy="907.95" r="14.9"/><circle class="pt" style="fill:#1b1b1b" cx="138.98" cy="907.95" r="6.1"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.29" cx="485.98" cy="147.95" r="6.77"/>
<text class="lbl " x="507.94" y="147.95" font-size="35.43" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">(x<tspan baseline-shift="sub" font-size="70%">0</tspan>, y<tspan baseline-shift="sub" font-size="70%">0</tspan>)</text>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="The tangent at (x0, y0): it passes through the point and is perpendicular to the gradient (f_x, f_y), that is (f_y)0 (y − y0) + (f_x)0 (x − x0) = 0.">
<path class="ink given" style="stroke-width:3.75;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M471.89 121.47L864.51 859.53"/>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="The radius vector r from the pedal point O to (x0, y0). The angle ψ lies between r and the tangent; θ is the angle of r from OX.">
<path class="ink given" style="stroke-width:3.75;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M138.98 907.95L485.98 147.95"/>
<text class="lbl " x="313.03" y="470.18" font-size="35.43" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">r</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.29" d="M456.85 211.76A70.14 70.14 0 0 0 518.92 209.88"/>
<text class="lbl " x="488.91" y="244.62" font-size="35.43" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">ψ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.29" d="M228.25 907.95A89.27 89.27 0 0 0 176.06 826.74"/>
<text class="lbl " x="248.7" y="842.03" font-size="35.43" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
</g>
<g class="step" data-step="3" data-tool="square" data-text="From O drop the perpendicular p on the tangent. Its length is the distance from the origin to the tangent line: p² = [x0 (f_x)0 + y0 (f_y)0]² / [(f_x)0² + (f_y)0²].">
<path class="ink given" style="stroke-width:3.75;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M138.98 907.95L724.56 596.44"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.29" cx="724.56" cy="596.44" r="6.77"/>
<text class="lbl " x="414.97" y="732.43" font-size="35.43" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">p</text>
</g>
<g class="step" data-step="4" data-tool="note" data-text="Eliminating x0 and y0 among f(x0, y0) = 0, the tangent and the expression for p² leaves a relation between r and p: the pedal equation.">
<text class="lbl  upright" x="499.67" y="498.57" font-size="35.43" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">f(x, y) = 0</text>
</g>
</svg>
