<g class="step" data-step="1" data-tool="dividers" data-text="Lay off the distance VF from V on the axis on the other side of V, and draw the directrix through that point at right angles to the axis.">
<path class="ink thick" style="stroke-width:2.83;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M49.97 279.57L462.97 279.57"/>
</g>
<g class="step" data-step="2" data-tool="compass" data-text="Take any point W of the directrix. The circle about W through the focus F cuts the directrix at two points: the reflections of F in the two tangents from W.">
<path class="ink aux" style="stroke-width:0.91;fill:none;stroke:#8a8a8a;stroke-linecap:round;stroke-linejoin:round" d="M377.17 279.57A141 141 0 0 0 95.16 279.57"/>
