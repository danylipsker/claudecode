<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.11" cx="236.17" cy="279.57" r="3.29"/>
</g>
<g class="step" data-step="4" data-tool="note" data-text="The two tangents meet at W at a right angle, whichever point W of the directrix is chosen: the directrix is the locus of the intersection of perpendicular tangents, the orthoptic of the parabola.">
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.11" d="M242.54 273.92L236.88 267.55L230.52 273.2"/>
</g>
