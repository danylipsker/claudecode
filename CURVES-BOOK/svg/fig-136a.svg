</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="Each tangent from W is the perpendicular bisector of the segment joining F to one of those two points. Draw the two tangents from W; each ends where it touches the parabola.">
<path class="ink aux" style="stroke-width:0.91;fill:none;stroke:#8a8a8a;stroke-linecap:round;stroke-linejoin:round" d="M252.97 139.57L95.16 279.57"/>
