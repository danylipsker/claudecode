<g class="step" data-step="2" data-tool="square" data-text="The roulette of O is therefore similar to the pedal of the fixed curve with respect to O1: if the perpendicular from O1 meets the tangent L at the foot N (a point of the pedal), then O lies at the double distance, O1O = 2·O1N. So the roulette is the pedal with twice its linear dimensions. (The cardioid is the simple example; see Caustics.)">
