</g>
<g class="step" data-step="1" data-tool="square" data-text="Drop the perpendicular from S to L and carry it as far again below L: this gives S̄, the reflection of S in L, with SS̄ perpendicular to L.">
<path class="ink cons dash" style="stroke-width:2.96;fill:none;--dash:16.14 10.76;stroke:#4b4b4b;stroke-dasharray:16.14 10.76;stroke-linecap:round;stroke-linejoin:round" d="M362.6 404.6L362.6 1040.6"/>
