<text class="lbl  upright" x="692.6" y="952.6" font-size="38.88" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">θ<tspan baseline-shift="sub" font-size="70%">1</tspan> &gt; θ<tspan baseline-shift="sub" font-size="70%">2</tspan>,  μ &gt; 1</text>
