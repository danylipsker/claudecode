<text class="lbl " x="402.3" y="1040.6" font-size="45.74" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">S̄</text>
</g>
<g class="step" data-step="2" data-tool="compass" data-text="Draw the circle through S, Q and S̄. Its centre is on L, because L is the perpendicular bisector of SS̄.">
<circle class="ink cons dash" style="stroke-width:2.96;fill:none;--dash:16.14 10.76;stroke:#4b4b4b;stroke-dasharray:16.14 10.76;stroke-linecap:round;stroke-linejoin:round" cx="628.24" cy="722.6" r="414.36"/>
</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="Produce TQ backwards until it meets the circle again at P and the line SS̄ at A. Join PS and PS̄. Q is the middle of the arc SS̄, so PQ bisects the angle at P of triangle SPS̄.">
<path class="ink cons dash" style="stroke-width:2.96;fill:none;--dash:16.14 10.76;stroke:#4b4b4b;stroke-dasharray:16.14 10.76;stroke-linecap:round;stroke-linejoin:round" d="M1042.6 722.6L545.85 316.52"/>
