<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 1345.2 1275.2" width="520" height="493" data-fig="fig-015b">
<title>Fig. 15(b) — Refraction at a line, rare to dense medium (μ &gt; 1)</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 15(b), page 18. Section: caustics.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
