<text class="lbl  upright" x="692.6" y="682.6" font-size="36.59" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">RARE</text>
<text class="lbl  upright" x="912.6" y="684.6" font-size="36.59" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">L</text>
