<path class="ink cons dash" style="stroke-width:2.96;fill:none;--dash:16.14 10.76;stroke:#4b4b4b;stroke-dasharray:16.14 10.76;stroke-linecap:round;stroke-linejoin:round" d="M545.85 316.52L362.6 1040.6"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.96" cx="545.85" cy="316.52" r="8.74"/>
<text class="lbl " x="574.77" y="282.49" font-size="45.74" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.96" cx="362.6" cy="166.72" r="8.74"/>
<text class="lbl " x="333.68" y="132.69" font-size="45.74" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
</g>
<g class="step" data-step="4" data-tool="note" data-text="The marked angles: θ1 at S, θ1 at P (exterior angle APS and angle S̄PQ), θ2 at A. Again μ = sin θ1 / sin θ2 = AS / PS = AS̄ / PS̄.">
