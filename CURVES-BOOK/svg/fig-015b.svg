svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The line L between a rare medium (above) and a dense one (below); the radiant point S in the rare medium; the incident ray SQ and the refracted ray QT, which obey sin θ1 = μ sin θ2 with μ &gt; 1.">
<path class="ink thick" style="stroke-width:7.53;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M112.6 722.6L1232.6 722.6"/>
