<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:3.76" cx="257.05" cy="605.56" r="14.92"/><circle class="pt" style="fill:#1b1b1b" cx="257.05" cy="605.56" r="6.1"/>
<text class="lbl " x="212.19" y="658.33" font-size="35.47" text-anchor="end" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
<path class="ink given" style="stroke-width:3.76;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M257.05 605.56L564.05 107.56"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.29" cx="564.05" cy="107.56" r="6.78"/>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Draw the tangent to the curve at X.">
<path class="ink given" style="stroke-width:3.76;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M564.05 107.56L696.19 293.54"/>
</g>
<g class="step" data-step="2" data-tool="square" data-text="From P drop the perpendicular p on the tangent: its foot F is a point of the pedal.">
<path class="ink given" style="stroke-width:3.76;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M257.05 605.56L696.19 293.54"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.29" cx="696.19" cy="293.54" r="6.78"/>
<text class="lbl " x="493.44" y="469.34" font-size="35.47" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">p</text>
</g>
<g class="step" data-step="3" data-tool="compass" data-text="The circle on r = PX as diameter (centre M, the midpoint of PX) passes through F, because the angle PFX is a right angle. The open dot is its centre.">
<circle class="ink given" style="stroke-width:3.76;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="410.55" cy="356.56" r="292.51"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.29" cx="410.55" cy="356.56" r="6.78"/>
<text class="lbl " x="448.84" y="244.51" font-size="35.47" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">r</text>
</g>
<g class="step" data-step="4" data-tool="note" data-text="The angle ψ between r and the tangent at X equals the angle between p and the tangent to the pedal at F (both are inscribed in the same circle on the same chord).">
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.29" d="M537.25 151.04A51.07 51.07 0 0 0 593.63 149.19"/>
<text class="lbl " x="566.59" y="185.19" font-size="35.47" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">ψ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.29" d="M654.56 323.12A51.07 51.07 0 0 0 707.2 343.41"/>
<text class="lbl " x="668.25" y="366.01" font-size="35.47" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">ψ</text>
</g>
<g class="step" data-step="5" data-tool="straightedge" data-text="So the tangent to the pedal at F is the tangent to the circle on r as diameter: the line through F perpendicular to MF.">
<path class="ink given" style="stroke-width:3.76;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M671.42 181.24L774.19 647.04"/>
<text class="lbl  upright" x="837.05" y="485.56" font-size="31.92" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">PEDAL</text>
<text class="lbl  upright" x="861.05" y="527.56" font-size="31.92" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">TANGENT</text>
<path class="ink given" style="stroke-width:3.76;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M829.05 488.56L747.05 488.56"/>
<path class="head given" style="stroke:none;fill:#1b1b1b" d="M747.05 488.56L762.65 495.12L762.65 482.01Z"/>
</g>
<g class="step" data-step="6" data-tool="pencil" data-text="The pedal itself: the locus of F as X runs along the curve. It touches the line just drawn at F.">
