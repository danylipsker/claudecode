<g class="step" data-step="1" data-tool="pencil" data-text="The terms of lowest degree, −x²y + y³ = y(y − x)(y + x), give three distinct tangents at the origin: y = 0, y = x, y = −x, so the origin is a triple point. Putting y = tx gives x = t − t³, y = t² − t⁴: draw two loops that touch the x-axis and two branches that run down along y = ±x.">
