<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.62" cx="117.36" cy="239.36" r="1.84"/>
<text class="lbl " x="117.36" y="245.32" font-size="9.61" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">O</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.62" cx="213.36" cy="167.36" r="1.84"/>
<text class="lbl " x="219.32" y="167.36" font-size="9.61" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Draw OP (its length is r), and from P the horizontal PB to the y-axis. Then PB = x and OB = y.">
<path class="ink given" style="stroke-width:1.02;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M117.36 239.36L213.36 167.36"/>
<path class="ink given" style="stroke-width:1.02;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M117.36 167.36L213.36 167.36"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.62" cx="117.36" cy="167.36" r="1.84"/>
<text class="lbl " x="111.4" y="167.36" font-size="9.61" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">B</text>
<text class="lbl " x="165.36" y="160.8" font-size="9.61" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">x</text>
<text class="lbl " x="123.92" y="203.36" font-size="9.61" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">y</text>
<text class="lbl " x="165.09" y="193.8" font-size="9.61" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">r</text>
</g>
<g class="step" data-step="2" data-tool="compass" data-text="Find A, the centre of the circle through O and P that touches OX at O: it is where the perpendicular bisector of OP meets OY. Draw the circle; it cuts OY again at C, and OC = 2R is a diameter.">
<path class="ink cons" style="stroke-width:0.62;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M178.56 220.96L110.16 129.76"/>
<circle class="ink given" style="stroke-width:1.1;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="117.36" cy="139.36" r="100"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.62" cx="117.36" cy="139.36" r="1.84"/>
<text class="lbl " x="111.4" y="139.36" font-size="9.61" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.62" cx="117.36" cy="39.36" r="1.84"/>
<text class="lbl " x="112.29" y="33.4" font-size="9.61" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">C</text>
</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="Join C to P. The angle OPC is in a semicircle, so it is a right angle, and PB is the altitude of the triangle OPC: PB² = OB · BC, that is x² = y (2R − y). The angle OCP is equal to θ, the angle POX (tangent and chord).">
<path class="ink given" style="stroke-width:1.02;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M117.36 39.36L213.36 167.36"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.62" d="M117.36 50.61A11.25 11.25 0 0 0 124.11 48.36"/>
<text class="lbl " x="124.34" y="60.29" font-size="9.61" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.62" d="M130.34 239.36A12.98 12.98 0 0 0 127.74 231.57"/>
<path class="head given" style="stroke:none;fill:#1b1b1b" d="M127.74 231.57L128.88 236.12L131.79 233.94Z"/>
<text class="lbl " x="139.59" y="231.95" font-size="9.61" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
</g>
<g class="step" data-step="4" data-tool="note" data-text="Hence 2R − y = x²/y. As P moves along the curve towards O the circle becomes the osculating circle, and R₀ = lim x² / 2y. In polar coordinates r = 2R sin θ, so R₀ = lim r / 2θ.">
<text class="lbl  upright" x="117.36" y="265.36" font-size="8.65" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">R<tspan baseline-shift="sub" font-size="70%">0</tspan> = lim x<tspan baseline-shift="super" font-size="70%">2</tspan> / 2y   (P → O)</text>
</g>
</svg>
