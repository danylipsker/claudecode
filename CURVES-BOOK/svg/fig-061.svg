<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 61, page 61. Section: curvature.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
