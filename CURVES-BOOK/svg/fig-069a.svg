</g>
<g class="step" data-step="6" data-tool="straightedge" data-text="T is the instantaneous centre of P, so TP is the normal; the tangent is perpendicular to it and passes through N, the end of the diameter through T. Extend it both ways to meet the curve at B and C: N is the midpoint of BC and BC = 4b. The angle between the tangent and NT is 3t/2.">
