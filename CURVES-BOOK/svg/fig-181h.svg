<g class="step" data-step="1" data-tool="straightedge" data-text="The highest-degree terms x⁴ − y⁴ = (x − y)(x + y)(x² + y²) give the directions y = ±x of the asymptotes; the constant is found as in the folium: y = x − 1/2 and y = −x − 1/2, crossing at (0, −1/2). Draw them.">
