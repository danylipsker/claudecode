</g>
<g class="step" data-step="2" data-tool="pencil" data-text="The lowest-degree terms y(y² − 3x²) give three tangents at the origin (y = 0, y = ±√3 x): a triple point. Putting y = tx gives the curve in terms of t: draw the wide U through the origin (|t| &lt; 1), the loop above it (|t| &gt; √3) and the two branches that run down along the asymptotes (1 &lt; |t| &lt; √3).">
