<title>Fig. 157(a) — The radial of the cycloid: a circle of radius 2a</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 157(a), page 172. Section: radial.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
