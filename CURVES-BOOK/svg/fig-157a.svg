<g class="step" data-step="1" data-tool="roll" data-text="The generating circle of radius a rolls along the base line. When it touches the line at H, with OH equal to the arc a·t, the point P (which was at O) is on the cycloid. The angle at the centre between the vertical and ZP is t.">
<circle class="ink given" style="stroke-width:4.06;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="826.96" cy="765.21" r="231"/>
