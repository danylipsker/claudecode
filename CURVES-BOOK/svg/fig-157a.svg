<text class="lbl " x="854.56" y="649.71" font-size="38.32" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">a</text>
<text class="lbl " x="854.56" y="880.71" font-size="38.32" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">a</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.48" d="M781.14 780.44A48.29 48.29 0 0 0 826.96 813.5"/>
<text class="lbl " x="778.53" y="832.34" font-size="38.32" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">t</text>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Join P to H: H is the instantaneous centre of the rolling circle, so PH is the normal of the cycloid at P. Since the angle PH-top is a right angle in a semicircle, the angle between HP and the base line is half of t.">
<path class="ink cons dash" style="stroke-width:2.48;fill:none;--dash:13.53 9.02;stroke:#4b4b4b;stroke-dasharray:13.53 9.02;stroke-linecap:round;stroke-linejoin:round" d="M607.75 838.05L826.96 996.21"/>
