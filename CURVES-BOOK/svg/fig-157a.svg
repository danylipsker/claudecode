</g>
<g class="step" data-step="3" data-tool="square" data-text="The radius of curvature of the cycloid at P is twice PH. Through the point O draw the line parallel to HP.">
<path class="ink cons" style="stroke-width:2.48;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M538.21 996.21L362.84 869.68"/>
</g>
<g class="step" data-step="4" data-tool="dividers" data-text="Carry the length R = 2·PH from O along that line: its end R is a point of the radial.">
<path class="ink thick" style="stroke-width:6.31;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M538.21 996.21L99.78 679.89"/>
