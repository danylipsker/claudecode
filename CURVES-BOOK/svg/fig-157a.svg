<text class="lbl " x="363.43" y="785.78" font-size="38.32" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">R</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.48" d="M490.66 961.9A58.64 58.64 0 0 0 479.58 996.21"/>
<text class="lbl " x="446.86" y="966.7" font-size="38.32" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">t/2</text>
</g>
<g class="step" data-step="5" data-tool="pencil" data-text="Repeat for other positions of the generating circle: the points R run along a circle of radius 2a through O (r = 4a sin(t/2) = 4a sin θ, with θ = π − t/2).">
<circle class="ink curve" style="stroke-width:6.31;fill:none;stroke:#0b4fa0;stroke-linecap:round;stroke-linejoin:round" cx="538.21" cy="534.21" r="462"/>
</g>
