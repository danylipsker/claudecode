<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 465.12 320.27" width="520" height="358" data-fig="fig-129b">
<title>Fig. 129(b) — The Hart crossed parallelogram</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 129(b), page 131. Section: inversion.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The crossed parallelogram of four bars: AB = CD and AC = BD, with the bases AD and BC parallel. The points O, P, Q, R divide the bars AB, BD, AC, CD in the same ratio and lie on a line parallel to the bases.">
<path class="ink thick" style="stroke-width:2.6;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M28.56 283.56L148.56 28.56"/>
<path class="ink thick" style="stroke-width:2.6;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M436.56 283.56L316.56 28.56"/>
<path class="ink thick" style="stroke-width:2.6;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M148.56 28.56L436.56 283.56"/>
<path class="ink thick" style="stroke-width:2.6;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M28.56 283.56L316.56 28.56"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.02" cx="28.56" cy="283.56" r="5.14"/>
<text class="lbl " x="42.29" y="283.56" font-size="15.81" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.02" cx="436.56" cy="283.56" r="5.14"/>
<text class="lbl " x="422.83" y="283.56" font-size="15.81" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">D</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.02" cx="148.56" cy="28.56" r="5.14"/>
<text class="lbl " x="138.56" y="16.79" font-size="15.81" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">B</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.02" cx="316.56" cy="28.56" r="5.14"/>
<text class="lbl " x="326.56" y="16.79" font-size="15.81" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">C</text>
</g>
<g class="step" data-step="1" data-tool="linkage" data-text="Mark O on AB, P on BD, Q on AC and R on CD at the same fraction of the bars from B and C. O, P, Q, R stay on a line parallel to AD and BC as the linkage is deformed.">
<path class="ink cons dash" style="stroke-width:1.02;fill:none;--dash:5.58 3.72;stroke:#4b4b4b;stroke-dasharray:5.58 3.72;stroke-linecap:round;stroke-linejoin:round" d="M128.76 70.63L336.36 70.63"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.02" cx="128.76" cy="70.63" r="5.14"/>
<text class="lbl " x="116.99" y="70.63" font-size="15.81" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">O</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.02" cx="196.08" cy="70.63" r="5.14"/>
<text class="lbl " x="206.08" y="58.87" font-size="15.81" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.02" cx="269.04" cy="70.63" r="5.14"/>
<text class="lbl " x="259.04" y="58.87" font-size="15.81" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">Q</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.02" cx="336.36" cy="70.63" r="5.14"/>
<text class="lbl " x="346.36" y="58.87" font-size="15.81" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">R</text>
</g>
<g class="step" data-step="2" data-tool="note" data-text="Draw the circle through D, A, P and Q; it meets AB again at F. By the secant property (BF)(BA) = (BP)(BD). BA, BP, BD are constant, so BF is constant: F is a fixed point of the bar AB. Then (OP)(OQ) = (OF)(OA) is constant: P and Q are inverse points about O.">
<path class="ink cons dash" style="stroke-width:1.02;fill:none;--dash:5.58 3.72;stroke:#4b4b4b;stroke-dasharray:5.58 3.72;stroke-linecap:round;stroke-linejoin:round" d="M435.92 291.71A204.34 204.34 0 1 0 29.2 291.71"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.02" cx="111.67" cy="106.95" r="5.14"/>
<text class="lbl " x="98.93" y="106.95" font-size="15.81" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">F</text>
</g>
</svg>
