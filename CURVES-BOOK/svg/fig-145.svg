<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 496.37 533.19" width="520" height="559" data-fig="fig-145">
<title>Fig. 145 — Linkage of crossed parallelograms drawing the limacon</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 145, page 151. Section: limacon.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
