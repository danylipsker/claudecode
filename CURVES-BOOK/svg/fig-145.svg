</g>
<g class="step" data-step="1" data-tool="linkage" data-text="First crossed parallelogram CDKF: the bar CD turns about C by the angle θ with the base line; the bar DK (length CF) crosses the base line to K, and KF equals CD. The angle at K between KD and KF is also θ.">
