<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 1113.78 748.78" width="520" height="350" data-fig="fig-107">
<title>Fig. 107 — A triangle whose sides touch two fixed circles: the envelope of the third side</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 107, page 110. Section: glissettes.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The triangle ABC, with its side AB touching the fixed circle of centre X and its side AC touching the fixed circle of centre Y (the hatched discs). The triangle slides, keeping those contacts.">
<path class="ink given" style="stroke-width:4.01;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M68.39 680.39L738.39 68.39L1045.39 680.39L68.39 680.39"/>
<path class="ink hatchline" style="fill:none;stroke-width:3.12;stroke:#2a2a2a" d="M513.77 515.27L564.76 472.48M488.45 520.23L573.95 448.48M470.03 519.4L576.34 430.19M454.79 515.9L575.49 414.62M441.76 510.55L572.57 400.79M430.37 503.82L567.83 388.48M420.47 495.85L561.76 377.29M411.8 486.84L554.34 367.23M404.53 476.66L545.59 358.29M398.52 465.41L535.62 350.37M393.95 452.96L524.07 343.78M391.13 439.05L510.95 338.5M390.51 423.29L495.49 335.19M393.22 404.72L476.76 334.63M403.52 379.8L450.43 340.44"/>
<circle class="ink thick" style="stroke-width:6.24;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="483.39" cy="427.39" r="93.09"/>
<path class="ink hatchline" style="fill:none;stroke-width:3.12;stroke:#2a2a2a" d="M810.06 552.95L856.33 591.77M802.82 530.59L879.55 594.97M801.99 513.61L896.36 592.79M804.28 499.24L910.12 588.05M808.72 486.68L921.75 581.53M814.86 475.56L931.58 573.49M822.71 465.85L939.79 564.09M832.09 457.44L946.49 553.43M843.11 450.4L951.47 541.33M856.14 445.06L954.42 527.52M871.99 442.07L954.68 511.46M892.66 443.13L949.96 491.21"/>
<circle class="ink thick" style="stroke-width:6.24;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="878.39" cy="518.39" r="76.63"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="68.39" cy="680.39" r="10.14"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="738.39" cy="68.39" r="10.14"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="1045.39" cy="680.39" r="10.14"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="483.39" cy="427.39" r="10.14"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="878.39" cy="518.39" r="10.14"/>
<text class="lbl " x="761.87" y="68.39" font-size="37.87" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
<text class="lbl " x="88.35" y="703.87" font-size="37.87" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">B</text>
<text class="lbl " x="1065.35" y="703.87" font-size="37.87" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">C</text>
<text class="lbl " x="457.56" y="427.39" font-size="37.87" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">X</text>
<text class="lbl " x="904.22" y="518.39" font-size="37.87" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">Y</text>
</g>
<g class="step" data-step="1" data-tool="square" data-text="Through X draw the parallel to AB and through Y the parallel to AC. They meet at A' and cut BC at B' and C'. These two lines keep their place in the moving triangle, so A'B'C' is an invariable triangle.">
<path class="ink given" style="stroke-width:4.01;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M206.41 680.39L722.97 208.55"/>
<path class="ink given" style="stroke-width:4.01;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M722.97 208.55L959.65 680.39"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="206.41" cy="680.39" r="10.14"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="959.65" cy="680.39" r="10.14"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="722.97" cy="208.55" r="10.14"/>
<text class="lbl " x="226.37" y="703.87" font-size="37.87" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">B'</text>
<text class="lbl " x="939.7" y="703.87" font-size="37.87" text-anchor="end" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">C'</text>
<text class="lbl " x="722.97" y="182.73" font-size="37.87" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A'</text>
</g>
<g class="step" data-step="2" data-tool="compass" data-text="Draw the circle through A', X and Y. The angle XA'Y equals the angle A of the triangle, always, and XY is fixed, so this circle is a fixed circle.">
<circle class="ink cons" style="stroke-width:2.45;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" cx="693.74" cy="417.12" r="210.6"/>
</g>
<g class="step" data-step="3" data-tool="square" data-text="Through A' draw the parallel to BC; it meets the circle again at D. The angle DA'X equals the angle A'B'C' = angle ABC, which is constant, so D is a fixed point of the circle.">
<path class="ink given" style="stroke-width:4.01;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M664.51 208.55L722.97 208.55"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="664.51" cy="208.55" r="10.14"/>
<text class="lbl " x="664.51" y="178.03" font-size="37.87" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">D</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.45" d="M240.49 680.39A34.08 34.08 0 0 0 231.58 657.4"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.45" d="M248.83 680.39A42.41 42.41 0 0 0 237.73 651.79"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.45" d="M692.29 208.55A30.67 30.67 0 0 0 700.32 229.24"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.45" d="M683.96 208.55A39 39 0 0 0 694.17 234.86"/>
</g>
<g class="step" data-step="4" data-tool="square" data-text="From D drop the perpendicular DP to BC. DP is the altitude of the invariable triangle A'B'C'.">
<path class="ink given" style="stroke-width:4.01;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M664.51 208.55L664.51 680.39"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.45" cx="664.51" cy="680.39" r="10.14"/>
<text class="lbl " x="684.47" y="703.87" font-size="37.87" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="5" data-tool="straightedge" data-text="The normals to the sides at the points of contact pass through X and through Y; they meet at the instantaneous centre of the triangle, which lies on the fixed circle and on DP.">
<path class="ink cons dash" style="stroke-width:2.45;fill:none;--dash:13.37 8.91;stroke:#4b4b4b;stroke-dasharray:13.37 8.91;stroke-linecap:round;stroke-linejoin:round" d="M420.61 358.66L664.51 625.68"/>
<path class="ink cons dash" style="stroke-width:2.45;fill:none;--dash:13.37 8.91;stroke:#4b4b4b;stroke-dasharray:13.37 8.91;stroke-linecap:round;stroke-linejoin:round" d="M946.89 484.03L664.51 625.68"/>
</g>
<g class="step" data-step="6" data-tool="pencil" data-text="BC is always at the same distance DP from the fixed point D, so it touches the circle of centre D and radius DP: that is the envelope of the third side (a piece of the circle is drawn).">
<path class="ink curve" style="stroke-width:6.24;fill:none;stroke:#0b4fa0;stroke-linecap:round;stroke-linejoin:round" d="M534.12 662.01A471.84 471.84 0 0 0 794.91 662.01"/>
</g>
<g class="step" data-step="7" data-tool="note" data-text="The point glissettes of the triangle (for example, any point F of A'C') are limacons.">

</g>
</svg>
