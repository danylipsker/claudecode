<path class="ink thick" style="stroke-width:6.38;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M148.88 300.44L1066.27 509"/>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Draw CP' to cut the crease at Q, and join Q to P. Q is on the crease, which is the perpendicular bisector of PP', so QP = QP' = u; with QC = v we have u + v = CP' = r.">
<path class="ink cons dash" style="stroke-width:2.51;fill:none;--dash:13.68 9.12;stroke:#4b4b4b;stroke-dasharray:13.68 9.12;stroke-linecap:round;stroke-linejoin:round" d="M374.63 109.75L488.34 377.62"/>
