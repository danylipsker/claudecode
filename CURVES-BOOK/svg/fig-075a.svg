<text class="lbl " x="455.52" y="243.68" font-size="38.76" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">u</text>
<text class="lbl " x="379.17" y="497.84" font-size="38.76" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">u</text>
