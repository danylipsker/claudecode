svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The fixed circle of radius r with centre C, and the point P inside it (wax paper, so that you can fold it).">
<circle class="ink given" style="stroke-width:4.1;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="570" cy="570" r="500"/>
<circle class="pt" style="fill:#1b1b1b" cx="570" cy="570" r="12.6"/>
<text class="lbl " x="570" y="594.03" font-size="38.76" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">C</text>
<circle class="pt" style="fill:#1b1b1b" cx="270" cy="570" r="12.6"/>
<text class="lbl " x="270" y="594.03" font-size="38.76" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="1" data-tool="fold" data-text="Choose a point P' on the circle and fold P over onto P': the crease is the perpendicular bisector of PP'. Press it flat and unfold; draw PP' as a guide.">
<path class="ink cons dash" style="stroke-width:2.51;fill:none;--dash:13.68 9.12;stroke:#4b4b4b;stroke-dasharray:13.68 9.12;stroke-linecap:round;stroke-linejoin:round" d="M270 570L374.63 109.75"/>
