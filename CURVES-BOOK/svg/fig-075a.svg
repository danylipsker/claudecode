<text class="lbl  upright" x="570" y="1000" font-size="31.01" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">CP' = r</text>
</g>
<g class="step" data-step="3" data-tool="note" data-text="The crease bisects the angle between the two focal radii QP and QP' (the equal angles θ), so it is the tangent at Q.">
