<g class="step" data-step="2" data-tool="protractor" data-text="The tangent at P is the line that meets the radius vector at the constant angle α. At P lay off the angle α from PO; the line meets the perpendicular at T. PT = r sec α is the polar tangent, and by Descartes its length equals the arc of the spiral from the pole to P.">
<path class="ink cons" style="stroke-width:1.4;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M248.77 83.71L312.48 321.46"/>
