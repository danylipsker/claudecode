</g>
<g class="step" data-step="1" data-tool="square" data-text="At O draw the perpendicular to OP (the polar line). The polar tangent and the polar normal of P end on it.">
<path class="ink cons" style="stroke-width:1.4;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M39.17 153.87L319.76 315.87"/>
