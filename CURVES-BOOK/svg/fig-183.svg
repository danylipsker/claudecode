<title>Fig. 183 — The equiangular spiral: the constant angle α, the polar tangent PT and the polar normal PC</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 183, page 206. Section: spirals.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
