<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.4" d="M238.85 132.01A31.23 31.23 0 0 0 262.55 135.13"/>
<text class="lbl " x="247.63" y="156.9" font-size="21.69" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">α</text>
</g>
<g class="step" data-step="3" data-tool="square" data-text="At P draw the perpendicular to the tangent: the normal, which meets the perpendicular to OP at C. PC = r csc α = R is the polar normal, and it is also the radius of curvature at P (R = s cot α). The angle at C is α as well.">
