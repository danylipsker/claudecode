</g>
<g class="step" data-step="2" data-tool="protractor" data-text="The tangent makes the angle ψ = 2θ + π/2 with the radius vector, so the normal makes 2θ with it (and 3θ with the polar axis): at P lay off 2θ from PO and draw the normal.">
