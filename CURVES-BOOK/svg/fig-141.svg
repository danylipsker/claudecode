</g>
<g class="step" data-step="3" data-tool="square" data-text="The tangent is the perpendicular to the normal at P.">
<path class="ink thick" style="stroke-width:0.83;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M76.85 16.85L127.75 34.88"/>
</g>
<g class="step" data-step="4" data-tool="dividers" data-text="Divide OP into three equal parts; T is the division point farthest from O (OT = 2r/3).">
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.33" cx="78" cy="37.17" r="0.97"/>
</g>
<g class="step" data-step="5" data-tool="square" data-text="At T draw the perpendicular to OP. It meets the normal at C, the centre of curvature: the projection of R = a²/3r on the radius vector is R cos 2θ = r/3.">
