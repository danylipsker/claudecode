<title>Fig. 166 — The envelope of a line carried by a curve rolling on a curve</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 166, page 181. Section: roulettes.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
