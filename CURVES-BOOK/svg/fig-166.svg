</g>
<g class="step" data-step="2" data-tool="square" data-text="From the point of contact T drop the perpendicular z on the line. The normal to the line (the direction of z) makes the angle α with the common normal of the curves.">
<path class="ink given" style="stroke-width:3.93;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M416.02 621.29L296.35 287.07"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.4" cx="296.35" cy="287.07" r="7.09"/>
<text class="lbl " x="335.48" y="454.18" font-size="37.1" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">z</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.4" d="M416.02 547.83A73.47 73.47 0 0 0 391.25 552.13"/>
<text class="lbl " x="399.17" y="524.23" font-size="37.1" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">α</text>
</g>
<g class="step" data-step="3" data-tool="note" data-text="Then dσ/dφ = z + (cos α) · R1R2/(R1 + R2): the first term comes from the rotation about the point of contact, the second from the change of the point of contact along the curves.">

</g>
