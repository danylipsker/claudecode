<title>Fig. 45 — Aeroplane design: a conic through three points with two tangents, by Pascal lines</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 45, page 48. Section: conics.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
