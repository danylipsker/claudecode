<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 104(b), page 108. Section: glissettes.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
