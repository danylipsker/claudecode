<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 333.78 341.71" width="520" height="532" data-fig="fig-029">
<title>Fig. 29 — Trisection of an angle with the marked ruler</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 29, page 33. Section: conchoid.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The angle XOY to be trisected, with its vertex O.">
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M52.8 288.91L163.4 21.91"/>
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M52.8 288.91L312.8 288.91"/>
<text class="lbl " x="168.91" y="15.42" font-size="11.62" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">X</text>
<text class="lbl " x="312.8" y="280.26" font-size="11.62" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">Y</text>
<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.23" cx="52.8" cy="288.91" r="4.89"/><circle class="pt" style="fill:#1b1b1b" cx="52.8" cy="288.91" r="2"/>
<text class="lbl " x="61.99" y="299.71" font-size="11.62" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">O</text>
</g>
<g class="step" data-step="1" data-tool="dividers" data-text="Choose a length k with the dividers and mark B on OY with OB = k.">
<path class="ink cons" style="stroke-width:0.75;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M150.81 308.77A100 100 0 0 0 150.81 269.04"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="152.8" cy="288.91" r="2.22"/>
<text class="lbl " x="160.15" y="297.55" font-size="11.62" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">B</text>
<text class="lbl " x="102.8" y="279.91" font-size="11.04" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">k</text>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Through B draw BC parallel to OX, and the perpendicular BA to OX (A is its foot on OX).">
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M152.8 288.91L263.78 20.98"/>
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M39.73 242.07L152.8 288.91"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="67.45" cy="253.55" r="2.22"/>
<text class="lbl " x="58.87" y="243.47" font-size="11.62" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
<text class="lbl " x="269.29" y="14.5" font-size="11.62" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">C</text>
</g>
<g class="step" data-step="3" data-tool="ruler" data-text="The ruler carries two marks P and Q, 2k apart. Lay it with its edge through O and the mark P on the line AB; slide it about O until the mark Q falls on BC. The edge OPQ then makes the angle θ with OX.">
<path class="ink thick" style="stroke-width:4.98;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M20.98 320.73L244.73 96.98"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="82.09" cy="259.62" r="2.67"/>
<text class="lbl " x="93.62" y="259.62" font-size="11.62" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="223.51" cy="118.2" r="2.67"/>
<text class="lbl " x="235.04" y="118.2" font-size="11.62" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">Q</text>
</g>
<g class="step" data-step="4" data-tool="note" data-text="Why it works: M, the middle of PQ, is the centre of the circle through P, B and Q (the angle PBQ is right), so MB = MP = MQ = k = OB. Then the angles at Q and at O are θ and 2θ, and XOY = 3θ.">
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="152.8" cy="188.91" r="2.22"/>
<path class="ink cons dash" style="stroke-width:0.75;fill:none;--dash:4.1 2.73;stroke:#4b4b4b;stroke-dasharray:4.1 2.73;stroke-linecap:round;stroke-linejoin:round" d="M152.8 288.91L152.8 188.91"/>
<text class="lbl " x="145.6" y="238.91" font-size="11.62" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">k</text>
<text class="lbl " x="111.32" y="217.06" font-size="11.62" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">k</text>
<text class="lbl " x="182.03" y="146.35" font-size="11.62" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">k</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.75" d="M65.35 288.91A12.55 12.55 0 0 0 61.67 280.03"/>
<text class="lbl " x="72.44" y="280.77" font-size="11.62" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">2θ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.75" d="M85.33 256.37A46.01 46.01 0 0 0 70.41 246.4"/>
<text class="lbl " x="84.17" y="241.96" font-size="11.62" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.75" d="M141.71 200A15.68 15.68 0 0 0 152.8 204.59"/>
<text class="lbl " x="141.13" y="217.08" font-size="11.62" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">2θ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.75" d="M211.68 130.03A16.73 16.73 0 0 0 217.11 133.65"/>
<text class="lbl " x="207.92" y="141.53" font-size="11.62" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
</g>
<g class="step" data-step="5" data-tool="pencil" data-text="The mark Q describes a conchoid of Nicomedes (the conchoid of the line AB with respect to O, constant 2k); where it meets BC the angle is trisected.">
