<title>Fig. 78(a) — The epicycloid: the rolling circle at one position, with the tangent</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 78(a), page 81. Section: epi-hypo-cycloids.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
