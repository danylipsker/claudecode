<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 342 242" width="520" height="368" data-fig="fig-123a">
<title>Fig. 123(a) — Inverse of A by the tangent and the perpendicular</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 123(a), page 128. Section: inversion.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The circle of inversion, centre O and radius k, and a point A outside it.">
<circle class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="121" cy="121" r="100"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="121" cy="121" r="2.22"/>
<text class="lbl " x="114.87" y="113.79" font-size="11.63" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">O</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="321" cy="121" r="2.22"/>
<text class="lbl " x="321" y="113.79" font-size="11.63" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Draw OA.">
<path class="ink cons" style="stroke-width:0.75;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M121 121L321 121"/>
</g>
<g class="step" data-step="2" data-tool="compass" data-text="Draw the circle on OA as diameter: it cuts the circle of inversion at the two points of contact P and P′ of the tangents from A (the angle OPA in a semicircle is a right angle).">
<circle class="ink aux dash" style="stroke-width:0.62;fill:none;--dash:4.1 2.74;stroke:#8a8a8a;stroke-dasharray:4.1 2.74;stroke-linecap:round;stroke-linejoin:round" cx="221" cy="121" r="100"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="171" cy="34.4" r="2.22"/>
<text class="lbl " x="171" y="27.19" font-size="11.63" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="171" cy="207.6" r="2.22"/>
</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="Draw the tangents AP and AP′ and the radii OP and OP′ (length k).">
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M321 121L171 34.4"/>
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M321 121L171 207.6"/>
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M121 121L171 34.4"/>
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M121 121L171 207.6"/>
<text class="lbl " x="137.35" y="77.7" font-size="11.63" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">k</text>
</g>
<g class="step" data-step="4" data-tool="straightedge" data-text="From P draw the perpendicular to OA (the chord PP′). It meets OA at Ā. The right triangles OĀP and OPA are similar, so OĀ / k = k / OA, that is OA · OĀ = k².">
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M171 34.4L171 207.6"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.75" d="M176.76 121L176.76 115.24L171 115.24"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.75" cx="171" cy="121" r="2.22"/>
<text class="lbl " x="178.97" y="111.63" font-size="11.63" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">Ā</text>
</g>
</svg>
