<path class="ink given" style="fill:none;stroke-width:3.19;stroke:#1b1b1b;stroke-linecap:round" d="M183.93 204.55L194.39 105.1"/><path class="ink" style="fill:none;stroke-width:1.47;stroke:#fff;stroke-linecap:round" d="M183.93 204.55L194.39 105.1"/>
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M91.88 187.97L101.25 198.38L75.98 221.13L66.62 210.72Z"/>
<path class="ink given" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M40.05 238.01L43.78 237.67L41.57 242.69L46.79 241.02L46.07 244.7"/>
<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.23" cx="183.93" cy="204.55" r="4.87"/><circle class="pt" style="fill:#1b1b1b" cx="183.93" cy="204.55" r="1.99"/>
<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.23" cx="83.93" cy="204.55" r="4.87"/><circle class="pt" style="fill:#1b1b1b" cx="83.93" cy="204.55" r="1.99"/>
<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.23" cx="194.39" cy="105.1" r="4.87"/><circle class="pt" style="fill:#1b1b1b" cx="194.39" cy="105.1" r="1.99"/>
<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.23" cx="276.13" cy="31.49" r="4.87"/><circle class="pt" style="fill:#1b1b1b" cx="276.13" cy="31.49" r="1.99"/>
</g>
<g class="step" data-step="5" data-tool="pencil" data-text="The pencil at P draws the limacon r = 2a cos θ + k (the book shows a short piece of it through P).">
<path class="ink curve" style="stroke-width:1.91;fill:none;stroke:#0b4fa0;stroke-linecap:round;stroke-linejoin:round" d="M319.97 55.56L317.93 54.06L315.87 52.58L313.79 51.14L311.69 49.72L309.58 48.34L307.44 46.99L305.3 45.67L303.13 44.38L300.95 43.13L298.76 41.9L296.55 40.71L294.33 39.55L292.1 38.43L289.85 37.34L287.59 36.28L285.32 35.26L283.04 34.26L280.75 33.31L278.44 32.38L276.13 31.49L273.81 30.64L271.48 29.82L269.14 29.03L266.8 28.28L264.45 27.56L262.09 26.88L259.73 26.23L257.36 25.61L254.99 25.03L252.61 24.49L250.23 23.97L247.85 23.5L245.46 23.06L243.07 22.65L240.68 22.28L238.29 21.94L235.9 21.64L233.51 21.37L231.12 21.13L228.74 20.93"/>
</g>
</svg>
