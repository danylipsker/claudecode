</g>
<g class="step" data-step="2" data-tool="pencil" data-text="As the curve rolls, the point O1 describes its roulette (the thick curve rising from O; here a cycloid), and the centre of curvature moves along x = s = f(φ), y = R = f′(φ). For a circle R is constant, so this locus is the horizontal line y = R (dashed).">
