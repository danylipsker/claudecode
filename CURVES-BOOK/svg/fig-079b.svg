<text class="lbl " x="386.27" y="263.87" font-size="17.41" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">T'</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.13" cx="427.5" cy="236.7" r="3.33"/>
<text class="lbl " x="418.33" y="247.5" font-size="17.41" text-anchor="end" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A'</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.13" cx="477.9" cy="220.33" r="3.33"/>
<text class="lbl " x="487.08" y="209.53" font-size="17.41" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">F</text>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Join T to T'. The chord cuts the small circle again at P, the tracing point: the angle T'PF is in a semicircle, so PF is perpendicular to TP.">
<path class="ink given" style="stroke-width:1.84;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M234.43 449.43L427.5 183.7"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.13" cx="427.5" cy="183.7" r="3.33"/>
<text class="lbl " x="436.67" y="172.91" font-size="17.41" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="Draw FP and carry it to meet the axis at D: OD = OF, so the triangle OFD is isosceles. Join E to T': ET' is parallel to DP, and DE = 2b.">
<path class="ink given" style="stroke-width:1.84;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M234.43 43.43L477.9 220.33"/>
<path class="ink given" style="stroke-width:1.84;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M234.43 149.43L377.09 253.08"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.13" cx="234.43" cy="43.43" r="3.33"/>
<text class="lbl " x="225.26" y="32.64" font-size="17.41" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">D</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.13" d="M234.43 60.67A17.23 17.23 0 0 0 248.38 53.56"/>
<text class="lbl " x="251.74" y="77.4" font-size="17.41" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.13" d="M234.43 166.67A17.23 17.23 0 0 0 248.38 159.56"/>
<text class="lbl " x="251.74" y="183.4" font-size="17.41" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.13" d="M466.5 212.04A14.1 14.1 0 0 0 464.5 224.68"/>
</g>
<g class="step" data-step="4" data-tool="compass" data-text="The circle through T, P and D (the angle DPT is a right angle, so DT is its diameter) touches the fixed circle at T: it is the second generating circle, of radius a + b, with its centre A on the axis, b above O.">
<circle class="ink given" style="stroke-width:1.84;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="234.43" cy="246.43" r="203"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.13" cx="234.43" cy="246.43" r="3.33"/>
<text class="lbl " x="223.64" y="246.43" font-size="17.41" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
</g>
<g class="step" data-step="5" data-tool="dividers" data-text="Mark X on the fixed circle so that the arc T'X is bθ (the arc of the small circle from T' to P): X is the cusp, where the curve meets the fixed circle. Then arc TX = (a + b)θ, the arc of the large circle from T to P: the same point P is obtained by both circles.">
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.13" cx="317.97" cy="174.85" r="3.33"/>
<text class="lbl " x="317.97" y="185.64" font-size="17.41" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">X</text>
</g>
<g class="step" data-step="6" data-tool="pencil" data-text="The epicycloid near the cusp X, drawn through P: the same curve is generated by the circle of radius b and by the circle of radius a + b.">
