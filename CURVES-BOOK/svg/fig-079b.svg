<path class="ink hatchline" style="fill:none;stroke:#2a2a2a;stroke-width:1.43" d="M297.83 435.38L300.33 420.23M307.61 430.37L309 415.08M317.01 424.66L317.27 409.31M325.96 418.28L325.09 402.94M334.41 411.26L332.43 396.03M342.34 403.63L339.24 388.59M349.68 395.45L345.49 380.67M356.4 386.75L351.14 372.32M362.47 377.59L356.17 363.58M367.85 368L360.54 354.49M372.51 358.04L364.23 345.11"/>
