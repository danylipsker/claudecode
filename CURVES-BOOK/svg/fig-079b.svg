<text class="lbl " x="223.64" y="299.43" font-size="17.41" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">O</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.13" cx="234.43" cy="449.43" r="3.33"/>
<text class="lbl " x="223.64" y="449.43" font-size="17.41" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">T</text>
