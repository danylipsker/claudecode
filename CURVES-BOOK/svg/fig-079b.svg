<text class="lbl " x="225.26" y="138.64" font-size="17.41" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">E</text>
</g>
<g class="step" data-step="1" data-tool="compass" data-text="Choose T' on the fixed circle (the angle TOT' is the angle the rolling has gone through) and draw the generating circle of radius b touching the fixed circle at T', outside it: its centre A' is on OT'. Mark the other end F of the diameter T'F, by carrying the line OT' on.">
<path class="ink given" style="stroke-width:1.84;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M234.43 299.43L477.9 220.33"/>
<circle class="ink given" style="stroke-width:1.84;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="427.5" cy="236.7" r="53"/>
