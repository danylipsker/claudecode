</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Draw the incident ray ST, the light going from S to the point T of the curve.">
<path class="ink given" style="stroke-width:1.87;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M166.92 423.92L297.92 238.92"/>
<path class="head given" style="stroke:none;fill:#1b1b1b" d="M250.76 305.52L241 311.6L248.27 316.75Z"/>
</g>
<g class="step" data-step="2" data-tool="square" data-text="Drop the perpendicular from S to the tangent; its foot is P. As T runs along the curve, P describes the pedal of f = 0 with respect to S.">
<path class="ink given" style="stroke-width:1.87;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M166.92 423.92L166.92 31.92"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.14" cx="166.92" cy="238.92" r="3.72"/>
<text class="lbl " x="157.61" y="227.96" font-size="17.67" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.14" d="M176.64 238.92L176.64 248.64L166.92 248.64"/>
</g>
<g class="step" data-step="3" data-tool="compass" data-text="Mark S̄ on the perpendicular beyond P with PS̄ = PS: S̄ is the reflection of S in the tangent. As T runs along the curve, S̄ describes the orthotomic, the pedal enlarged twice from S.">
<path class="ink cons" style="stroke-width:1.14;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M200.04 56.91A185 185 0 0 0 133.8 56.91"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.14" cx="166.92" cy="53.92" r="3.72"/>
<text class="lbl " x="155.96" y="53.92" font-size="17.67" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">S̄</text>
</g>
<g class="step" data-step="4" data-tool="straightedge" data-text="Join S̄ to T and carry the line on beyond T: the line S̄TQ is the reflected ray (the mirror image of ST in the tangent). T is the instantaneous centre of S̄, so TQ is the normal of the orthotomic.">
<path class="ink given" style="stroke-width:1.87;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M166.92 53.92L436.78 435.02"/>
<path class="head given" style="stroke:none;fill:#1b1b1b" d="M436.78 435.02L434.29 423.79L427.02 428.94Z"/>
<text class="lbl " x="446.09" y="424.06" font-size="17.67" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">Q</text>
</g>
<g class="step" data-step="5" data-tool="note" data-text="As T moves, the reflected rays TQ envelope the caustic, which is therefore the evolute of the orthotomic.">

</g>
</svg>
