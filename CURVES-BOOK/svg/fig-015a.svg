<path class="ink cons dash" style="stroke-width:3.29;fill:none;--dash:17.92 11.95;stroke:#4b4b4b;stroke-dasharray:17.92 11.95;stroke-linecap:round;stroke-linejoin:round" d="M420.34 229.79L701.7 1051.7"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:3.29" cx="420.34" cy="229.79" r="9.71"/>
<text class="lbl " x="420.34" y="192.01" font-size="50.78" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:3.29" cx="701.7" cy="417.52" r="9.71"/>
<text class="lbl " x="669.59" y="455.3" font-size="50.78" text-anchor="end" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
</g>
<g class="step" data-step="4" data-tool="note" data-text="The marked angles: θ1 at S, θ1 twice at P (PQ bisects SPS̄), θ2 twice at A. The triangles SAP and S̄AP give μ = sin θ1 / sin θ2 = AS / PS = AS̄ / PS̄.">
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:3.29" d="M701.7 284.82A73.12 73.12 0 0 0 746.1 269.79"/>
