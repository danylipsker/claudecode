</g>
<g class="step" data-step="1" data-tool="square" data-text="Drop the perpendicular from S to L and carry it as far again below L: this gives S̄, the reflection of S in L, with SS̄ perpendicular to L.">
<path class="ink cons dash" style="stroke-width:3.29;fill:none;--dash:17.92 11.95;stroke:#4b4b4b;stroke-dasharray:17.92 11.95;stroke-linecap:round;stroke-linejoin:round" d="M701.7 211.7L701.7 1051.7"/>
