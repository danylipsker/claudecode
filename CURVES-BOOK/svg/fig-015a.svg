svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The line L between a dense medium (above) and a rare one (below); the radiant point S in the dense medium; the incident ray SQ and the refracted ray QT, which obey sin θ1 = μ sin θ2 with μ &lt; 1.">
<path class="ink thick" style="stroke-width:8.36;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M111.7 631.7L1351.7 631.7"/>
