<text class="lbl  upright" x="401.7" y="961.7" font-size="43.16" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">θ<tspan baseline-shift="sub" font-size="70%">1</tspan> &lt; θ<tspan baseline-shift="sub" font-size="70%">2</tspan>,  μ &lt; 1</text>
