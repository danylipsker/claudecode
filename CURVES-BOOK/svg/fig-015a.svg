</g>
<g class="step" data-step="2" data-tool="compass" data-text="Draw the circle through S, Q and S̄. Its centre is on L, because L is the perpendicular bisector of SS̄.">
<circle class="ink cons dash" style="stroke-width:3.29;fill:none;--dash:17.92 11.95;stroke:#4b4b4b;stroke-dasharray:17.92 11.95;stroke-linecap:round;stroke-linejoin:round" cx="587.43" cy="631.7" r="435.27"/>
</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="Produce TQ backwards until it meets the circle again at P and the line SS̄ at A. Join PS and PS̄. Q is the middle of the arc SS̄, so PQ bisects the angle at P of triangle SPS̄.">
<path class="ink cons dash" style="stroke-width:3.29;fill:none;--dash:17.92 11.95;stroke:#4b4b4b;stroke-dasharray:17.92 11.95;stroke-linecap:round;stroke-linejoin:round" d="M1022.7 631.7L420.34 229.79"/>
