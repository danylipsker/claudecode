<title>Fig. 144(b) — The tangent to the limacon by the point of contact T</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 144(b), page 150. Section: limacon.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
