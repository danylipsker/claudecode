</g>
<g class="step" data-step="3" data-tool="straightedge" data-text="T is the instantaneous centre of rotation of the rolling circle, so TP is normal to the path of P.">
<path class="ink given" style="stroke-width:2.08;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M283.26 245.53L370.34 221.52"/>
