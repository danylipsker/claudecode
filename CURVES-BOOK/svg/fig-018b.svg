<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 644.1 554.5" width="520" height="448" data-fig="fig-018b">
<title>Fig. 18(b) — The radical axis of two circles by a third circle</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 18(b), page 22. Section: circle.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="Two circles that do not meet. The radical axis is the line of the points of equal power with respect to both.">
<circle class="ink given" style="stroke-width:2.32;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="184.55" cy="184.55" r="145"/>
<circle class="ink given" style="stroke-width:2.32;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="504.55" cy="291.55" r="100"/>
</g>
<g class="step" data-step="1" data-tool="compass" data-text="Draw a third circle, arbitrary, cutting both of the given circles.">
<path class="ink given" style="stroke-width:2.32;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M440 503.98A190.59 190.59 0 1 0 183.89 514.95"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.42" cx="122.78" cy="315.74" r="4.19"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.42" cx="329.46" cy="179.41" r="4.19"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.42" cx="430.52" cy="224.33" r="4.19"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.42" cx="495.16" cy="391.11" r="4.19"/>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Draw the common chord of the third circle and each of the given circles (each is the radical axis of that pair). The two chords meet at R, the radical centre of the three circles.">
<path class="ink given" style="stroke-width:2.32;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M81.04 343.27L419.45 120.05"/>
<path class="ink given" style="stroke-width:2.32;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M508.89 426.54L384.15 104.7"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.42" cx="396.08" cy="135.47" r="4.19"/>
<text class="lbl  upright" x="409.93" y="119.18" font-size="21.9" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">R</text>
</g>
<g class="step" data-step="3" data-tool="note" data-text="R has equal power with respect to all three circles, so it is on the radical axis of the first two: the line through R perpendicular to the line of the centres (dashed).">
<path class="ink cons dash" style="stroke-width:1.42;fill:none;--dash:7.73 5.15;stroke:#4b4b4b;stroke-dasharray:7.73 5.15;stroke-linecap:round;stroke-linejoin:round" d="M500.73 -177.5L291.43 448.44"/>
<path class="ink aux dot" style="stroke-width:1.16;fill:none;--dot:1.29 5.8;stroke:#8a8a8a;stroke-dasharray:1.29 5.8;stroke-linecap:round;stroke-linejoin:round" d="M184.55 184.55L504.55 291.55"/>
</g>
</svg>
