<text class="lbl " x="261.31" y="326.1" font-size="32.71" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">r</text>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Draw the tangent to the curve at X1.">
<path class="ink given" style="stroke-width:3.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M97.92 113.35L902.92 270.35"/>
</g>
<g class="step" data-step="2" data-tool="square" data-text="From O drop the perpendicular p on this tangent. Its foot F is a point of the pedal, and p is the distance from the pole to the tangent of the given curve.">
<path class="ink given" style="stroke-width:3.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M394.92 565.35L469.51 182.92"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.12" cx="469.51" cy="182.92" r="6.25"/>
