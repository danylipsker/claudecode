</g>
<g class="step" data-step="3" data-tool="compass" data-text="The circle on r = OX1 as diameter passes through F. The tangent to the pedal at F is also tangent to this circle (the angle ψ is the same for both).">
<circle class="ink aux dash" style="stroke-width:1.73;fill:none;--dash:11.54 7.7;stroke:#8a8a8a;stroke-dasharray:11.54 7.7;stroke-linecap:round;stroke-linejoin:round" cx="297.42" cy="347.85" r="238.35"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.12" cx="297.42" cy="347.85" r="4.38"/>
<path class="ink aux dash" style="stroke-width:1.73;fill:none;--dash:11.54 7.7;stroke:#8a8a8a;stroke-dasharray:11.54 7.7;stroke-linecap:round;stroke-linejoin:round" d="M297.42 347.85L469.51 182.92"/>
</g>
<g class="step" data-step="4" data-tool="square" data-text="Draw the tangent to the pedal at F: the line through F perpendicular to MF.">
<path class="ink given" style="stroke-width:3.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M383.02 92.68L760.12 486.15"/>
</g>
<g class="step" data-step="5" data-tool="square" data-text="From O drop the perpendicular p1 on the tangent to the pedal. The similar right triangles give p1 = p²/r, that is p² = r · p1 = f(p) · p1.">
<path class="ink given" style="stroke-width:3.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M394.92 565.35L624.84 345"/>
