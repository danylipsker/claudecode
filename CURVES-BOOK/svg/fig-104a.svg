<path class="ink given" style="fill:none;stroke:#1b1b1b;stroke-width:0.84" d="M223.07 23.39L23.39 255.07L357.55 310.39Z"/>
<text class="lbl " x="223.07" y="15.36" font-size="12.95" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="2" data-tool="compass" data-text="The angle APB never changes, so P always lies on the circle through A, B and P (the inscribed angle on the chord AB is constant). Draw the arc APB: it is the glissette of P.">
<path class="ink curve" style="stroke-width:2.13;fill:none;stroke:#0b4fa0;stroke-linecap:round;stroke-linejoin:round" d="M305.07 198.39A130.44 130.44 0 1 0 67.07 204.39"/>
</g>
<g class="step" data-step="3" data-tool="note" data-text="Any point Q of the side AP then describes a limacon, because Q moves on the circle of P by a fixed length along the line through A.">

</g>
</svg>
