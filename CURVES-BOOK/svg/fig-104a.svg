<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 380.94 333.78" width="520" height="456" data-fig="fig-104a">
<title>Fig. 104(a) — Glissette of the vertex of a rigid angle whose sides pass through two fixed points</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 104(a), page 108. Section: glissettes.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The two fixed points A and B.">
<circle class="pt" style="fill:#1b1b1b" cx="67.07" cy="204.39" r="3.22"/>
<circle class="pt" style="fill:#1b1b1b" cx="305.07" cy="198.39" r="3.22"/>
<text class="lbl " x="59.04" y="204.39" font-size="12.95" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
<text class="lbl " x="313.1" y="198.39" font-size="12.95" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">B</text>
</g>
<g class="step" data-step="1" data-tool="linkage" data-text="The rigid angle: a template (the hatched triangle) with its vertex at P and one side always through A, the other always through B. Slide it, keeping both sides on the points.">
