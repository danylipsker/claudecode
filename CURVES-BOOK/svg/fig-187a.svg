<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 427.5 416.38" width="520" height="506" data-fig="fig-187a">
<title>Fig. 187(a) — The spiral of Archimedes drawn by a carpenter's square rolling on a circle</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 187(a), page 210. Section: spirals.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The circle of radius a about O, the initial line, and the point A′ where the initial line meets the circle. At the start A is at A′ and B is at O.">
<path class="ink cons" style="stroke-width:0.94;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M26.25 290.13L401.25 290.13"/>
<circle class="ink given" style="stroke-width:1.54;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="186.25" cy="290.13" r="100"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.94" cx="186.25" cy="290.13" r="2.5"/>
<text class="lbl " x="178.59" y="299.14" font-size="14.54" text-anchor="end" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">O</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.94" cx="286.25" cy="290.13" r="2.5"/>
<text class="lbl " x="293.91" y="299.14" font-size="14.54" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A′</text>
</g>
<g class="step" data-step="1" data-tool="protractor" data-text="Take the angle θ from OA′: the radius OT meets the circle at T, the point where the square now touches. The arc A′T is aθ long.">
<path class="ink cons" style="stroke-width:0.94;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M186.25 290.13L113.88 221.12"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.94" cx="113.88" cy="221.12" r="2.5"/>
<text class="lbl " x="124.69" y="221.12" font-size="14.54" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">T</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.94" d="M199.33 290.13A13.08 13.08 0 0 0 176.78 281.1"/>
<text class="lbl " x="196.38" y="264.83" font-size="14.54" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
<text class="lbl " x="141.64" y="265.54" font-size="14.54" text-anchor="end" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">a</text>
</g>
<g class="step" data-step="2" data-tool="square" data-text="The long arm of the square lies along the tangent at T: draw the perpendicular to OT at T.">
<path class="ink cons" style="stroke-width:0.94;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M41.42 297.11L294.68 31.5"/>
</g>
<g class="step" data-step="3" data-tool="dividers" data-text="The square rolls without slipping, so the arc A′T unwinds along the tangent: lay off TA = arc A′T = aθ from T in the direction away from A′. A is a point of the involute of the circle.">
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.94" cx="278.11" cy="48.87" r="2.5"/>
<text class="lbl " x="267.39" y="36.25" font-size="14.54" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
</g>
<g class="step" data-step="4" data-tool="square" data-text="At A draw the perpendicular to the tangent, toward the circle, and lay off AB = a. Then OB is parallel to TA and OB = TA = aθ = r: B is a point of the spiral of Archimedes.">
<path class="ink cons" style="stroke-width:0.94;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M278.11 48.87L350.49 117.88"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.94" d="M273.7 53.5L278.33 57.91L282.74 53.28"/>
<path class="ink cons dash" style="stroke-width:0.94;fill:none;--dash:5.13 3.42;stroke:#4b4b4b;stroke-dasharray:5.13 3.42;stroke-linecap:round;stroke-linejoin:round" d="M186.25 290.13L350.49 117.88"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.94" cx="350.49" cy="117.88" r="2.5"/>
<text class="lbl " x="359.5" y="117.88" font-size="14.54" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">B</text>
<text class="lbl " x="260.71" y="194.99" font-size="14.54" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">r</text>
</g>
<g class="step" data-step="5" data-tool="note" data-text="The square itself: a long arm and a short arm AB = a, shown hatched. T is the centre of rotation of the rolling square, so TA and TB are the normals to the paths of A and B.">
