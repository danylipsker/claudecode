<title>Fig. 31(b) — Focus and directrix: the parabola (e = 1), polar form with a horizontal directrix</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 31(b), page 36. Section: conics.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
