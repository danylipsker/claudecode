<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 387.6 387.6" width="520" height="520" data-fig="fig-090">
<title>Fig. 90 — A removable discontinuity: y = (x² − 4)/(x − 2)</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 90, page 100. Section: discontinuous.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The axes. The function is undefined at x = 2, so the point of the graph above x = 2 will be an open circle.">
<path class="ink axis" style="stroke-width:1.16;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M23.8 288.8L363.8 288.8"/>
<path class="head axis" style="stroke:none;fill:#1b1b1b" d="M363.8 288.8L356.55 285.76L356.55 291.84Z"/>
<path class="ink axis" style="stroke-width:1.16;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M193.8 363.8L193.8 23.8"/>
<path class="head axis" style="stroke:none;fill:#1b1b1b" d="M193.8 23.8L190.76 31.05L196.84 31.05Z"/>
<text class="lbl axis" x="370.75" y="296.97" font-size="13.18" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">X</text>
<text class="lbl axis" x="200.75" y="15.63" font-size="13.18" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">Y</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.85" cx="193.8" cy="288.8" r="2.52"/>
<path class="ink cons dash" style="stroke-width:0.85;fill:none;--dash:4.65 3.1;stroke:#4b4b4b;stroke-dasharray:4.65 3.1;stroke-linecap:round;stroke-linejoin:round" d="M293.8 288.8L293.8 88.8"/>
<text class="lbl  upright" x="293.8" y="302.8" font-size="11.86" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">2</text>
</g>
<g class="step" data-step="1" data-tool="pencil" data-text="Away from x = 2 the quotient equals x + 2 (the factor x − 2 cancels): draw the line y = x + 2 and leave the point (2, 4) open.">
<path class="ink curve" style="stroke-width:2.17;fill:none;stroke:#0b4fa0;stroke-linecap:round;stroke-linejoin:round" d="M68.8 313.8L333.8 48.8"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.85" cx="293.8" cy="88.8" r="2.52"/>
</g>
<g class="step" data-step="2" data-tool="note" data-text="The limit of y as x → 2 is 4 (marked on the y-axis): the discontinuity is removable, because giving y the value 4 at x = 2 makes the graph continuous.">
<path class="ink cons dash" style="stroke-width:0.85;fill:none;--dash:4.65 3.1;stroke:#4b4b4b;stroke-dasharray:4.65 3.1;stroke-linecap:round;stroke-linejoin:round" d="M193.8 88.8L293.8 88.8"/>
<text class="lbl  upright" x="187.8" y="88.8" font-size="11.86" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">4</text>
</g>
</svg>
