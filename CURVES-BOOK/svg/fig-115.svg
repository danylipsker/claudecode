<title>Fig. 115 — The ellipse of the trammel: centre of rotation, normal and tangent</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 115, page 120. Section: instantaneous-center.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
