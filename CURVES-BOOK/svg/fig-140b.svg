<g class="step" data-step="4" data-tool="note" data-text="Why: in the isosceles triangle CAB (CA = CB = a/2) the chord is AB = a cos α, and the sine rule in triangle OCB gives sin α = √2 sin θ. So r = a√(1 − 2 sin²θ), r² = a² cos 2θ.">
