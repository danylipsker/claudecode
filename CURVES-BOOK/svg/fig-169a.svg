<title>Fig. 169(a) — The crossed parallelogram rolling an ellipse on a line: the elliptic catenary</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 169(a), page 184. Section: roulettes.</desc>
