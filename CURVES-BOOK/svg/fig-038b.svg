</g>
<g class="step" data-step="2" data-tool="note" data-text="The intercepts are the roots of Ax² + 2Dx + F = 0 and Cy² + 2Ey + F = 0, so 1/a1 + 1/a2 = −2D/F and 1/b1 + 1/b2 = −2E/F. The polar of P(0, 0), Dx + Ey + F = 0, is x(1/a1 + 1/a2) + y(1/b1 + 1/b2) − 2 = 0; it contains R.">
<circle class="pt cons open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.52" cx="350.42" cy="519.71" r="10.43"/>
</g>
