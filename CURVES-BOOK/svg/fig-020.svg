<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 905.8 991.8" width="520" height="569" data-fig="fig-020">
<title>Fig. 20 — The problem of Apollonius: a circle tangent to three circles</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 20, page 23. Section: circle.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="Three given circles, no two of them touching and with no common circle of their pencil.">
<circle class="ink given" style="stroke-width:3.57;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="206.9" cy="206.9" r="146"/>
<circle class="ink given" style="stroke-width:3.57;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="736.9" cy="350.9" r="108"/>
<circle class="ink given" style="stroke-width:3.57;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="293.9" cy="722.9" r="208"/>
<circle class="pt" style="fill:#1b1b1b" cx="206.9" cy="206.9" r="3.87"/>
<text class="lbl " x="222.89" y="188.08" font-size="28.66" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">C<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
<circle class="pt" style="fill:#1b1b1b" cx="736.9" cy="350.9" r="3.87"/>
<text class="lbl " x="752.89" y="332.08" font-size="28.66" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">C<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
<circle class="pt" style="fill:#1b1b1b" cx="293.9" cy="722.9" r="3.87"/>
<text class="lbl " x="309.89" y="704.08" font-size="28.66" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">C<tspan baseline-shift="sub" font-size="70%">3</tspan></text>
</g>
<g class="step" data-step="1" data-tool="compass" data-text="Shrink the smallest circle to a point: about the other two centres draw the circles of radii r1 − ρ and r3 − ρ (ρ = the radius of the smallest circle). A circle touching all three given circles from outside becomes, with its radius lessened by ρ, a circle through the centre of the smallest one that touches these two reduced circles.">
<circle class="ink cons dash" style="stroke-width:2.18;fill:none;--dash:11.9 7.93;stroke:#4b4b4b;stroke-dasharray:11.9 7.93;stroke-linecap:round;stroke-linejoin:round" cx="206.9" cy="206.9" r="38"/>
<circle class="ink cons dash" style="stroke-width:2.18;fill:none;--dash:11.9 7.93;stroke:#4b4b4b;stroke-dasharray:11.9 7.93;stroke-linecap:round;stroke-linejoin:round" cx="293.9" cy="722.9" r="100"/>
</g>
<g class="step" data-step="2" data-tool="compass" data-text="Find that circle: inversion about the centre of the smallest circle turns it into a common tangent of two circles (see Inversion); inverting back gives the circle through the three points. Its centre is X, and the radius we need is XC2 − ρ.">
<circle class="ink aux dash" style="stroke-width:1.79;fill:none;--dash:11.9 7.93;stroke:#8a8a8a;stroke-dasharray:11.9 7.93;stroke-linecap:round;stroke-linejoin:round" cx="463.52" cy="387.53" r="275.82"/>
<circle class="pt" style="fill:#1b1b1b" cx="463.52" cy="387.53" r="4.51"/>
</g>
<g class="step" data-step="3" data-tool="compass" data-text="Draw the circle about X of radius XC2 − ρ: it touches the three given circles.">
<circle class="ink given" style="stroke-width:3.57;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="463.52" cy="387.53" r="167.82"/>
</g>
<g class="step" data-step="4" data-tool="note" data-text="The solution circle is shaded. The three signs of the tangency (outside or inside each given circle) give the eight solutions.">
