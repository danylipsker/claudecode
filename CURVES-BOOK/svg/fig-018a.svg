<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 440.56 458.26" width="520" height="541" data-fig="fig-018a">
<title>Fig. 18(a) — The secant property of a circle</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 18(a), page 22. Section: circle.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="A circle with centre O and a point P outside it.">
<circle class="ink given" style="stroke-width:1.65;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="178.14" cy="280.12" r="150"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.01" cx="178.14" cy="280.12" r="2.68"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.01" cx="412.42" cy="28.14" r="2.98"/>
<text class="lbl  upright" x="421.45" y="38.77" font-size="15.58" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">P</text>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Through P draw any two lines cutting the circle: one at A and B (A nearer to P), the other at D and C (D nearer to P).">
<path class="ink given" style="stroke-width:1.65;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M412.42 28.14L29.42 260.55"/>
<path class="ink given" style="stroke-width:1.65;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M412.42 28.14L114.75 416.07"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.01" cx="229.44" cy="139.17" r="2.98"/>
<text class="lbl  upright" x="220.41" y="128.54" font-size="15.58" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">A</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.01" cx="29.42" cy="260.55" r="2.98"/>
<text class="lbl  upright" x="18.8" y="260.55" font-size="15.58" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">B</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.01" cx="114.75" cy="416.07" r="2.98"/>
<text class="lbl  upright" x="105.71" y="426.7" font-size="15.58" text-anchor="end" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">C</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.01" cx="293.05" cy="183.71" r="2.98"/>
<text class="lbl  upright" x="303.67" y="183.71" font-size="15.58" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">D</text>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Join A to D and B to C.">
<path class="ink given" style="stroke-width:1.65;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M229.44 139.17L293.05 183.71"/>
<path class="ink given" style="stroke-width:1.65;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M29.42 260.55L114.75 416.07"/>
</g>
<g class="step" data-step="3" data-tool="note" data-text="The angle PAD is equal to the angle BCD (the exterior angle of the cyclic quadrilateral ABCD equals the interior angle opposite). So the triangles PAD and PCB are similar and PA : PC = PD : PB, that is PA · PB = PD · PC.">
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.01" d="M246.67 151.24A21.03 21.03 0 0 0 247.42 128.26"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:1.01" d="M127.55 399.38A21.03 21.03 0 0 0 104.63 397.63"/>
</g>
</svg>
