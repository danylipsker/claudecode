<g class="step" data-step="2" data-tool="pencil" data-text="The locus of the centres of curvature is the evolute: its four cusps are the centres of curvature of the vertices, at (±(a² − b²)/a, 0) and (0, ±(a² − b²)/b). Its equation is (x/A)^{2/3} + (y/B)^{2/3} = 1 with Aa = Bb = a² − b².">
