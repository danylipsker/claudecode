<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:3.51" cx="687.77" cy="525.39" r="13.94"/><circle class="pt" style="fill:#1b1b1b" cx="687.77" cy="525.39" r="5.7"/>
<text class="lbl " x="687.77" y="554.16" font-size="33.15" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">F<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.14" cx="641.23" cy="281.15" r="6.34"/>
<text class="lbl " x="641.23" y="260.6" font-size="33.15" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Draw the tangent at P (heavy). All its other points lie outside the ellipse.">
<path class="ink given" style="stroke-width:5;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M173.98 59.86L915.08 410.84"/>
</g>
<g class="step" data-step="2" data-tool="straightedge" data-text="Take another point Q on the tangent. F1Q cuts the ellipse at R; join R and Q to F2. Since R is on the ellipse and Q outside it, F1Q + F2Q &gt; F1R + F2R = 2a.">
<path class="ink given" style="stroke-width:3.51;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M191.96 525.39L295.14 117.24"/>
<path class="ink given" style="stroke-width:3.51;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M255.64 273.5L687.77 525.39"/>
<path class="ink cons dash" style="stroke-width:2.14;fill:none;--dash:11.7 7.8;stroke:#4b4b4b;stroke-dasharray:11.7 7.8;stroke-linecap:round;stroke-linejoin:round" d="M295.14 117.24L687.77 525.39"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.14" cx="295.14" cy="117.24" r="6.34"/>
<text class="lbl " x="312.61" y="96.69" font-size="33.15" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">Q</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.14" cx="255.64" cy="273.5" r="6.34"/>
<text class="lbl " x="238.17" y="252.94" font-size="33.15" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">R</text>
</g>
<g class="step" data-step="3" data-tool="square" data-text="From F2 drop the perpendicular to the tangent, and carry the same distance beyond the tangent: this gives F̄2, the reflection of F2 in the tangent. Then F2Q = F̄2Q for every Q of the tangent.">
<path class="ink cons dash" style="stroke-width:2.14;fill:none;--dash:11.7 7.8;stroke:#4b4b4b;stroke-dasharray:11.7 7.8;stroke-linecap:round;stroke-linejoin:round" d="M687.77 525.39L859.67 162.4"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.14" cx="859.67" cy="162.4" r="6.34"/>
<text class="lbl " x="877.14" y="141.85" font-size="33.15" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">F̄<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
</g>
<g class="step" data-step="4" data-tool="straightedge" data-text="Join F1 to F̄2: this straight line is the shortest path from F1 to the tangent and on to F̄2. It cuts the tangent at P, because F1P + F2P = 2a is the least possible sum on the tangent. Also draw PF2.">
<path class="ink given" style="stroke-width:3.51;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M191.96 525.39L859.67 162.4"/>
<path class="ink given" style="stroke-width:3.51;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M641.23 281.15L687.77 525.39"/>
</g>
<g class="step" data-step="5" data-tool="note" data-text="The angle between the tangent and PF1 equals the angle between the tangent and PF̄2 (vertically opposite), and PF̄2 is the mirror image of PF2. So the tangent makes equal angles α = β with the two focal radii.">
<path class="ink given" style="fill:none;stroke:#1b1b1b;stroke-width:2.14" d="M610.23 266.46A34.31 34.31 0 0 0 611.09 297.53"/>
<text class="lbl given" x="575.88" y="282.97" font-size="33.15" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">α</text>
<path class="ink given" style="fill:none;stroke:#1b1b1b;stroke-width:2.14" d="M672.24 295.83A34.31 34.31 0 0 0 671.38 264.76"/>
<text class="lbl given" x="706.59" y="279.33" font-size="33.15" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">α</text>
<path class="ink given" style="fill:none;stroke:#1b1b1b;stroke-width:2.14" d="M647.66 314.85A34.31 34.31 0 0 0 672.24 295.83"/>
<text class="lbl given" x="683.52" y="335.82" font-size="33.15" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">β</text>
<text class="lbl " x="444.86" y="740.39" font-size="36.46" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">α = β</text>
</g>
