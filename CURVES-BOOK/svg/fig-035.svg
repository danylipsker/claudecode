<title>Fig. 35 — The optical property of the ellipse: the tangent bisects the angle of the focal radii</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 35, page 40. Section: conics.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
