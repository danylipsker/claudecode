<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 1060.2 619.43" width="520" height="304" data-fig="fig-067">
<title>Fig. 67 — The limit of the layers: the angles α and θ at the depth y</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 67, page 69. Section: cycloid.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="Two horizontal lines. On the upper line the particle starts; P is at the depth y below it, on the vertical through P.">
<path class="ink given" style="stroke-width:3.82;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M85.1 65.1L995.1 65.1"/>
<path class="ink given" style="stroke-width:3.82;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M65.1 537.1L965.1 537.1"/>
<path class="ink given" style="stroke-width:3.82;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M515.1 65.1L515.1 355.1"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.33" cx="515.1" cy="355.1" r="6.89"/>
<text class="lbl " x="534.1" y="377.45" font-size="36.05" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
<text class="lbl " x="477.1" y="215.1" font-size="32.44" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">y</text>
</g>
<g class="step" data-step="1" data-tool="protractor" data-text="Draw the path through P, making the angle θ with the horizontal; it is the tangent of the curve at P.">
<path class="ink curve" style="stroke-width:5.94;fill:none;stroke:#0b4fa0;stroke-linecap:round;stroke-linejoin:round" d="M162.95 554.33L802.32 192.6"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.33" d="M277.77 537.1A84.35 84.35 0 0 0 266.83 495.56"/>
<text class="lbl " x="308.97" y="506.68" font-size="36.05" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
</g>
<g class="step" data-step="2" data-tool="note" data-text="At P the path makes the angle α = 90° − θ with the vertical. The law of refraction becomes sin α = k·√y, that is cos θ = k·√y.">
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:2.33" d="M588.51 313.56A84.35 84.35 0 0 0 515.1 270.75"/>
<text class="lbl " x="578.02" y="247.21" font-size="36.05" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">α</text>
</g>
</svg>
