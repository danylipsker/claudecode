<path class="ink cons dash" style="stroke-width:0.9;fill:none;--dash:4.92 3.28;stroke:#4b4b4b;stroke-dasharray:4.92 3.28;stroke-linecap:round;stroke-linejoin:round" d="M196.78 108.78L150.2 200.2"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.9" cx="196.78" cy="108.78" r="2.67"/>
<text class="lbl " x="207.16" y="154.49" font-size="13.95" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">y</text>
<text class="lbl " x="173.49" y="209.72" font-size="13.95" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">x − k</text>
</g>
<g class="step" data-step="2" data-tool="pencil" data-text="The locus of all such P is the conic y² + (1 − e²)x² − 2kx + k² = 0; for e &lt; 1 it is an ellipse.">
