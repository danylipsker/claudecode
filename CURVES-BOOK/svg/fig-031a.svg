<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 365.4 410.4" width="520" height="584" data-fig="fig-031a">
<title>Fig. 31(a) — Focus and directrix: the ellipse (e &lt; 1), Cartesian form</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 31(a), page 36. Section: conics.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The directrix is the Y axis; the focus F lies on the X axis at the distance k from it. The ratio e = PF : (distance of P from the directrix) is fixed (here e &lt; 1).">
<path class="ink axis" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M25.2 200.2L340.2 200.2"/>
<path class="head axis" style="stroke:none;fill:#1b1b1b" d="M340.2 200.2L332.53 196.98L332.53 203.42Z"/>
<path class="ink axis" style="stroke-width:1.23;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M50.2 350.2L50.2 25.2"/>
<path class="head axis" style="stroke:none;fill:#1b1b1b" d="M50.2 25.2L46.98 32.87L53.42 32.87Z"/>
<text class="lbl axis" x="347.55" y="208.85" font-size="13.95" text-anchor="start" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">X</text>
<text class="lbl axis" x="57.55" y="16.55" font-size="13.95" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">Y</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.9" cx="50.2" cy="200.2" r="2.67"/>
<circle class="ink pivot" style="fill:#fff;stroke:#1b1b1b;stroke-width:1.48" cx="150.2" cy="200.2" r="5.87"/><circle class="pt" style="fill:#1b1b1b" cx="150.2" cy="200.2" r="2.4"/>
<text class="lbl " x="80.2" y="207.99" font-size="13.95" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">k</text>
</g>
<g class="step" data-step="1" data-tool="straightedge" data-text="Take a point P of the locus. Its distance from the directrix is x, its height above the axis is y, and its distance from the focus is PF = e · x. So (x − k)² + y² = e²x².">
<path class="ink cons dash" style="stroke-width:0.9;fill:none;--dash:4.92 3.28;stroke:#4b4b4b;stroke-dasharray:4.92 3.28;stroke-linecap:round;stroke-linejoin:round" d="M50.2 108.78L196.78 108.78"/>
