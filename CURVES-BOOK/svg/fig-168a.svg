<title>Fig. 168(a) — The crossed parallelogram: ellipses rolling on ellipses</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 168(a), page 183. Section: roulettes.</desc>
