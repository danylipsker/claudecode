<g class="step" data-step="1" data-tool="square" data-text="Draw PQ perpendicular to the carried line ℓ; Q is its foot. Every point of ℓ turns about P (P is the instantaneous centre), so Q, whose motion is perpendicular to PQ, moves along ℓ itself: ℓ touches its envelope at Q.">
