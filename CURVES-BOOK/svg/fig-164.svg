<g class="step" data-step="3" data-tool="note" data-text="The element of the envelope is dσ = QT + TQ1 = sin φ · ds + z · dφ (QT is the projection of ds on ℓ; TQ1 is an arc about P1 of radius z). Hence dσ/dφ = sin φ (ds/dφ) + z.">
