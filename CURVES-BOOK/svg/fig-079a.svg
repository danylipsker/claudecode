<text class="lbl " x="202.64" y="81.75" font-size="14.57" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.94" d="M234.65 170.56A11.8 11.8 0 0 0 235.13 182.62"/>
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.94" d="M310.13 121.55A11.8 11.8 0 0 0 310.61 133.61"/>
</g>
<g class="step" data-step="4" data-tool="compass" data-text="The circle through T, P and D (the angle DPT is a right angle, so DT is its diameter) touches the fixed circle at T: it is the second generating circle, of radius a − b, with its centre A on the axis, b below O.">
<circle class="ink given" style="stroke-width:1.54;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="186.32" cy="259.32" r="115"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.94" cx="186.32" cy="259.32" r="2.79"/>
<text class="lbl " x="177.28" y="259.32" font-size="14.57" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A</text>
</g>
<g class="step" data-step="5" data-tool="dividers" data-text="Mark X on the fixed circle so that the arc T'X is bθ (the arc of the small circle from T' to P): X is the cusp, where the curve meets the fixed circle. Then arc TX = (a − b)θ, the arc of the large circle from T to P: the same point P is obtained by both circles.">
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:0.94" cx="346.26" cy="218.77" r="2.79"/>
<text class="lbl " x="355.29" y="218.77" font-size="14.57" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">X</text>
</g>
