</g>
<g class="step" data-step="1" data-tool="compass" data-text="Choose T' on the fixed circle (the angle TOT' is the angle the rolling has gone through) and draw the generating circle of radius b touching the fixed circle at T', inside it: its centre A' is on OT'. Mark the other end F of the diameter T'F, by carrying the line OT' on.">
