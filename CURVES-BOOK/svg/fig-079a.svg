<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:0.94" d="M186.32 158.75A14.43 14.43 0 0 0 199 151.2"/>
<text class="lbl " x="202.64" y="171.75" font-size="14.57" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">θ</text>
