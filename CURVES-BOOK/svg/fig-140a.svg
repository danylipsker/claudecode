<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The foci F1 and F2, 2a apart, with their midpoint O, and the point X on the axis with OX = a√2. The curve is to be the locus of P with F1P · F2P = a².">
