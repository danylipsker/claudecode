<g class="step" data-step="1" data-tool="protractor" data-text="Draw the ray OT' with the angle XOT' = θ measured from the cusp (T' is on the fixed circle).">
<path class="ink cons" style="stroke-width:2.18;fill:none;stroke:#4b4b4b;stroke-linecap:round;stroke-linejoin:round" d="M486.9 456.9L732.61 141.27"/>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.18" cx="609.76" cy="299.08" r="7.09"/>
</g>
<g class="step" data-step="2" data-tool="dividers" data-text="Step off the distances on the ray: OT' = a, then T'A' = a/2 (A' is the centre of the rolling circle) and A'F = a/2, so that T'F is a diameter of the rolling circle.">
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.18" cx="609.76" cy="299.08" r="7.09"/>
<text class="lbl " x="630.66" y="299.08" font-size="33.72" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">T'</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.18" cx="671.19" cy="220.17" r="7.09"/>
<text class="lbl " x="692.09" y="220.17" font-size="33.72" text-anchor="start" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">A'</text>
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.18" cx="732.61" cy="141.27" r="7.09"/>
<text class="lbl " x="750.39" y="120.36" font-size="33.72" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">F</text>
</g>
<g class="step" data-step="3" data-tool="compass" data-text="The rolling circle of radius a/2 about A': it touches the fixed circle at T' (from outside).">
<circle class="ink given" style="stroke-width:3.57;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="671.19" cy="220.17" r="100"/>
</g>
<g class="step" data-step="4" data-tool="protractor" data-text="The tracing point P: the arc T'P of the small circle equals the arc XT' = aθ of the fixed circle, so the angle T'A'P = 2θ.">
<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.18" cx="579.62" cy="179.98" r="7.09"/>
<text class="lbl " x="579.62" y="159.07" font-size="33.72" text-anchor="middle" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">P</text>
</g>
<g class="step" data-step="5" data-tool="straightedge" data-text="Draw PT' and extend it to meet the fixed circle at T. Then extend TO beyond O to D, the point where TO meets FP: TD = 3a (OD = 2a).">
