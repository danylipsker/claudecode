<circle class="pt open" style="fill:#fff;stroke:#1b1b1b;stroke-width:2.18" cx="120.63" cy="296.12" r="7.09"/>
<text class="lbl " x="93.46" y="296.12" font-size="33.72" text-anchor="end" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:italic">D</text>
</g>
<g class="step" data-step="6" data-tool="compass" data-text="The circle on T, P and D. The angle DPT is a right angle, so TD is a diameter: the circle has radius 3a/2, its centre A is the midpoint of TD (OA = a/2) and it touches the fixed circle at T. This larger circle generates the same nephroid.">
<circle class="ink given" style="stroke-width:3.57;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="395.33" cy="416.71" r="300"/>
