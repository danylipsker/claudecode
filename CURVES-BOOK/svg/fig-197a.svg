<title>Fig. 197(a) — The right strophoid as the cissoid of a line and a circle</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 197(a), page 218. Section: strophoid.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
