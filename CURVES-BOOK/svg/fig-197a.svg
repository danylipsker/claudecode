<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="The centre O and the circle of radius a through A, the line L through O parallel to AB (AB is perpendicular to OA at A), the axis OA and the asymptote at the distance a from A.">
