<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 684 684" width="520" height="520" data-fig="fig-021a">
<title>Fig. 21(a) — A train of circles between two circles that do not meet</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 21(a), page 24. Section: circle.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="Two circles, one inside the other, not concentric.">
<circle class="ink given" style="stroke-width:2.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="342" cy="342" r="300"/>
<circle class="ink given" style="stroke-width:2.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="442" cy="342" r="137.5"/>
</g>
<g class="step" data-step="1" data-tool="compass" data-text="Start where the gap between the circles is widest: the circle that touches both on the axis, with its diameter the width of the gap.">
<circle class="ink given" style="stroke-width:2.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="173.25" cy="342" r="131.25"/>
</g>
<g class="step" data-step="2" data-tool="compass" data-text="Each next circle touches the two given circles and the one before it; going round above the axis the circles grow smaller as the gap narrows.">
<circle class="ink given" style="stroke-width:2.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="302.13" cy="147.84" r="101.79"/>
