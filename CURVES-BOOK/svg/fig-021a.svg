</g>
<g class="step" data-step="3" data-tool="compass" data-text="The same below the axis (the figure is symmetrical). The train does not close: a gap is left in the narrow part on the right.">
<circle class="ink given" style="stroke-width:2.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="302.13" cy="536.16" r="101.79"/>
