<circle class="ink given" style="stroke-width:2.46;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="597.38" cy="415.31" r="34.31"/>
</g>
<g class="step" data-step="4" data-tool="note" data-text="The circles of the train are shaded with horizontal lines.">
