<circle class="ink given" style="stroke-width:1.64;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="123.61" cy="79.59" r="18.55"/>
<circle class="ink given" style="stroke-width:1.64;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="96.2" cy="95.67" r="13.23"/>
<circle class="ink given" style="stroke-width:1.64;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="78.5" cy="110.41" r="9.8"/>
</g>
