<text class="lbl  upright" x="163" y="110.3" font-size="15.5" text-anchor="middle" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">X</text>
<text class="lbl  upright" x="376.89" y="146.66" font-size="15.5" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">Y</text>
</g>
<g class="step" data-step="2" data-tool="square" data-text="At B raise the perpendicular to AC; it meets the large semicircle at Z. The area of the arbelos equals the area of the circle on BZ as diameter.">
<path class="ink given" style="stroke-width:1.64;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M298 228L298 40.65"/>
<text class="lbl  upright" x="306.99" y="30.08" font-size="15.5" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">Z</text>
</g>
<g class="step" data-step="3" data-tool="compass" data-text="The train of Pappus: c0 is the circle on BC, and each next circle touches the circles on AB and AC and the one before it. The centre of the n-th circle is at the height 2n times its radius above AC, h_n = 2n·r_n. Draw c1, c2 … towards A.">
