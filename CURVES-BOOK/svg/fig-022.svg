<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="cw" viewBox="0 0 456 256" width="520" height="292" data-fig="fig-022">
<title>Fig. 22 — The arbelos and the train of Pappus</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 22, page 25. Section: circle.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
svg.cw .ink{stroke:#1b1b1b;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.cw .given{stroke:#1b1b1b}
svg.cw .cons{stroke:#4b4b4b}
svg.cw .aux{stroke:#8a8a8a}
svg.cw .axis{stroke:#1b1b1b}
svg.cw .curve{stroke:#0b4fa0}
svg.cw .thick{stroke:#1b1b1b}
svg.cw .hatchline{stroke:#2a2a2a}
svg.cw .lbl{fill:#1b1b1b;stroke:none;font-style:italic}
svg.cw .lbl.axis{font-style:normal}
svg.cw .lbl.upright{font-style:normal}
svg.cw .pt{fill:#1b1b1b;stroke:none}
svg.cw .pt.curve{fill:#0b4fa0}
svg.cw .pt.open{fill:#fff;stroke:#1b1b1b}
svg.cw .head{stroke:none}
svg.cw .fill{stroke:none}
svg.cw .pivot{fill:#fff;stroke:#1b1b1b}
svg.cw .dash{stroke-dasharray:var(--dash)}
svg.cw .dot{stroke-dasharray:var(--dot)}</style>
<rect width="100%" height="100%" fill="#fff"/>
<g class="step" data-step="0" data-tool="given" data-text="Three collinear points A, B, C. The arbelos is the figure bounded by the three semicircles on AB, BC and AC.">
<path class="ink given" style="stroke-width:1.64;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M28 228L428 228"/>
<text class="lbl  upright" x="37.8" y="216.47" font-size="15.5" text-anchor="start" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">A</text>
<text class="lbl  upright" x="288.2" y="216.47" font-size="15.5" text-anchor="end" dominant-baseline="auto" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">B</text>
<text class="lbl  upright" x="418.2" y="239.53" font-size="15.5" text-anchor="end" dominant-baseline="hanging" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">C</text>
</g>
<g class="step" data-step="1" data-tool="compass" data-text="Describe the semicircles on AB, BC and AC as diameters, all on the same side of the line.">
<path class="ink given" style="stroke-width:1.64;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" d="M428 228A200 200 0 0 0 28 228"/>
