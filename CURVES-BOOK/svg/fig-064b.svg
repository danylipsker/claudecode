<g class="step" data-step="2" data-tool="note" data-text="Because the arch is a cycloid, the force along the curve is proportional to the arc s measured from the lowest point (m s̈ = −k²s), so the motion is harmonic and the time to reach the lowest point does not depend on where the ball starts.">
