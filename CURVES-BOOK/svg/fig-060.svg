</g>
<g class="step" data-step="3" data-tool="compass" data-text="The circle about (α, β) with radius R: the osculating circle, or circle of curvature. It touches the curve at (x, y) and has the same y' and y'' there.">
<circle class="ink given" style="stroke-width:1.1;fill:none;stroke:#1b1b1b;stroke-linecap:round;stroke-linejoin:round" cx="223.43" cy="145.43" r="100"/>
</g>
<g class="step" data-step="4" data-tool="square" data-text="Drop the vertical from the centre and the horizontal from (x, y) to it. The right triangle (angle φ at the centre, since its sides are perpendicular to those of the tangent angle) gives α = x − R sin φ and β = y + R cos φ.">
