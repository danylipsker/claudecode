<title>Fig. 135 — Involute gear teeth: the base circles, the line of action and the profiles in contact</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 135, page 137. Section: involutes.</desc>
<style>svg.cw{font-family:"Times New Roman",Times,"Liberation Serif",serif;background:#fff}
