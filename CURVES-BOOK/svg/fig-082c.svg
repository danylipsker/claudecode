<g class="step" data-step="1" data-tool="pencil" data-text="The evolute is the locus of the centres of curvature: each branch has a centre-of-curvature cusp on the axis at distance (a² + b²)/a from O (beyond the vertex), and two arms that spread outwards. Its equation is (x/H)^{2/3} − (y/K)^{2/3} = 1 with Ha = Kb = a² + b².">
