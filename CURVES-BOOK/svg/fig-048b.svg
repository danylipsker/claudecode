<title>Fig. 48(b) — Pointwise construction of the parabola from circles about the focus and vertical lines</title>
<desc>Redrawn from Robert C. Yates, A Handbook on Curves and Their Properties (1947), Fig. 48(b), page 49. Section: conics.</desc>
