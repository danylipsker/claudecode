</g>
<g class="step" data-step="6" data-tool="note" data-text="The inclination of the tangent is α = θ + φ (α is measured at the point where the tangent meets the axis).">
<path class="ink cons" style="fill:none;stroke:#4b4b4b;stroke-width:3.72" d="M904.54 656.8A46.57 46.57 0 0 0 916.12 626.06"/>
