<text class="lbl  upright" x="791.55" y="349.06" font-size="29.32" text-anchor="middle" dominant-baseline="middle" style="fill:#1b1b1b;stroke:none;font-family:Times New Roman,Times,serif;font-style:normal">CURVE</text>
